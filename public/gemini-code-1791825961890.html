<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>OLYMP CUSTOM BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#0f0f11;--ink:#f8f9fa;--mut:#8a8a8e;--hair:rgba(255,255,255,.06);--hair2:rgba(255,255,255,.15);
--red:#ff2d3b;--red2:#d91b29;--dgray:#1c1c1e;--glow:255,45,59;
--sb:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
--st:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px));
--f:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none}
html.lock,html.lock body{overflow:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:400 15px/1.55 var(--f);background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 0 0,rgba(255,45,59,.18) 0,rgba(217,27,41,.08) 15vmax,transparent 50vmax),radial-gradient(circle at 100% 100%,rgba(255,45,59,.18) 0,transparent 45vmax)}
button,input{font-family:var(--f)}
#app{max-width:880px;margin:0 auto;padding:20px 16px calc(var(--sb) + 36px)}

h1{margin:2px 0 0;font:800 clamp(22px,7vw,32px)/1.12 var(--f);text-transform:uppercase;letter-spacing:-0.02em;color:#fff}
.sub{margin-top:10px;font:600 15px/1.35 var(--f);color:var(--mut)}
.sub small{display:block;margin-top:2px;font:400 13px var(--f);color:rgba(255,255,255,0.6)}
h2{margin:0 0 6px;font:700 16px/1.3 var(--f);letter-spacing:-0.01em}
.mut,small{color:var(--mut)}
.eye{margin-bottom:4px;font:600 11px var(--f);text-transform:uppercase;letter-spacing:0.05em;color:var(--mut)}
.back{display:inline-flex;align-items:center;gap:8px;padding:4px 0 12px;color:#fff;font:600 13px var(--f);cursor:pointer}
.back::before{content:"";width:6px;height:6px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}

.card{margin-top:12px;padding:18px;border-radius:14px;background:var(--card);border:1px solid var(--hair);box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.stat{min-height:120px;display:flex;flex-direction:column;background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent}
.stat .eye{color:rgba(255,255,255,.9);font-weight:700}
.stat b{margin-top:auto;font:800 32px/1 var(--f);color:#fff}
.bar{height:6px;margin-top:14px;border-radius:99px;background:rgba(0,0,0,.2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .7s ease}
.me{background:#161213;border:1px solid rgba(var(--glow),.4)}
.gray{background:var(--dgray);border-color:transparent}
.code{font:800 22px/1.2 var(--f);letter-spacing:.12em;color:#fff}
.teams{display:grid;gap:12px}@media(min-width:720px){.teams{grid-template-columns:1fr 1fr}}
.th{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;font:800 13px var(--f);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--hair2)}
.th span{color:var(--mut);font:600 12px var(--f);text-transform:none;letter-spacing:0}

.role{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--hair);padding:10px 0;min-height:60px;font:inherit;cursor:pointer}
.role:last-child{border-bottom:0}
.role i{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font:700 11px var(--f);color:#aaa;background:#1a1a1c;border:1px solid var(--hair2)}
.role span b{display:block;font:700 13px var(--f)}.role small{font-size:12px}
.role em{font:700 11px var(--f);font-style:normal;padding:6px 12px;border-radius:6px}
.role.free em{background:rgba(var(--glow),.15);color:var(--red)}
.role.taken{opacity:.5;cursor:default}.role.taken em{color:var(--mut)}
.role.mine{opacity:1}.role.mine i{background:var(--red);border-color:var(--red);color:#fff}
.role.mine em{background:var(--red);color:#fff}

.btn{display:block;width:100%;min-height:48px;border:1px solid transparent;border-radius:12px;font:700 13px var(--f);margin-top:10px;color:#fff;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}
.pri{background:var(--red);box-shadow:0 4px 20px rgba(var(--glow),.4)}
.sec{background:var(--dgray);border-color:var(--hair2);color:#fff}

.ov{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{width:100%;max-width:520px;max-height:85vh;overflow-y:auto;background:var(--card);border:1px solid var(--hair2);border-top:2px solid var(--red);border-radius:20px 20px 0 0;padding:20px 16px calc(var(--sb) + 20px)}
.sheet input{width:100%;height:48px;margin-top:6px;padding:0 14px;border-radius:10px;border:1px solid var(--hair2);background:#000;color:#fff;font-size:15px;outline:0}
.sheet input:focus{border-color:var(--red)}
.toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%);z-index:9;background:#161213;border:1px solid var(--red);padding:10px 16px;border-radius:10px;font:600 13px var(--f);color:#fff}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--hair)}
.tab{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--mut);font:700 12px var(--f);cursor:pointer}
.tab.on{background:var(--red);color:#fff}

.credit{max-width:880px;margin:20px auto 0;padding:16px;text-align:center;font:500 11px/1.4 var(--f);color:var(--mut);border-top:1px solid var(--hair)}
.credit a{color:var(--red);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>

<div class="credit">
    © 2026 OLYMP CUSTOM. Все права на материалы MLBB принадлежат <strong>Moonton</strong>.<br>
    Данные интеграции: <a href="https://github.com/ridwaanhall/rone-arena-python" target="_blank">Rone Arena API</a> (разработка <strong>ridwaanhall / RoneAI</strong>).<br>
    Создано при поддержке бота <a href="https://t.me/refillstorebot?start=aff_5100806492" id="refillLink">REFILL</a>
</div>

<script>
const tg = Telegram.WebApp;
tg.ready(); tg.expand();
try { tg.disableVerticalSwipes?.(); } catch {}

const ROLES = [['jungle','Jungle','#ff2d3b','JG'],['exp','EXP','#ff2d3b','EX'],['mid','Mid','#ff2d3b','MD'],['gold','Gold','#ff2d3b','GD'],['roam','Roam','#ff2d3b','RM']];
const TABS = [['custom', 'Кастомные игры'], ['rating', 'Рейтинг и Сезоны']];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const roleName = k => ROLES.find(r => r[0] === k)?.[1] || k;

let S = { players: [], count: 0, me: null }, tab = 'custom', G = null, P = null;

async function api(path, method = 'GET', body) {
  try {
    const r = await fetch('/api/' + path, { method, body: body && JSON.stringify(body),
      headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg.initData, 'X-Lobby': G || '' } });
    return { ok: r.ok, status: r.status, ...await r.json().catch(() => ({})) };
  } catch { return { ok: false, error: 'network' }; }
}

function toast(t) {
  const e = document.createElement('div'); e.className = 'toast'; e.textContent = t;
  document.body.append(e); setTimeout(() => e.remove(), 2500);
}

function sheet(html) {
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = '<div class="sheet">' + html + '</div>';
  o.onclick = e => { if (e.target === o) o.remove(); };
  document.body.append(o); return o.firstChild;
}

async function loadProfile() {
  const r = await api('profile');
  if (r.ok) P = r.profile;
}

async function render() {
  if (tab === 'rating') {
    const r = await api('rating');
    const season = r.season || { name: 'Сезон 1: MLBB x OLYMP', endsIn: '14 дней' };
    const list = r.leaderboard || [];
    $('#app').innerHTML = `
      <h1>Рейтинговая система</h1>
      <div class="sub">${esc(season.name)} <small>Сезонный сброс через: ${season.endsIn}</small></div>
      <div class="card stat" style="margin-top:16px">
        <div class="eye">Твой рейтинг и MVP</div>
        <b>${P?.rating || 0} RP <span style="font-size:16px">(${P?.mvpCount || 0} MVP)</span></b>
        <small style="color:#fff;margin-top:6px">Зарабатывай MVP в кастомках, повышай ранг и получай призы!</small>
      </div>
      <div class="card">
        <div class="th"><b>Топ игроков сезона</b><span>Ранг / RP</span></div>
        ${list.length ? list.map((u, i) => `
          <div class="role" style="cursor:default">
            <i>#${i+1}</i>
            <span><b>${esc(u.nick || '@' + u.username)}</b><small>ID: ${u.mlbbId || '—'}</small></span>
            <em>${u.rating} RP</em>
          </div>`).join('') : '<p class="mut" style="padding:10px 0">Пока нет данных рейтинга в этом сезоне.</p>'
        }
      </div>
      <div class="tabs">${TABS.map(([k, n]) => `<button class="tab${k === tab ? ' on' : ''}" data-tab="${k}">${n}</button>`).join('')}</div>
    `;
    return;
  }

  const { players, count } = S, full = count >= 10;
  const team = t => `<div class="card"><div class="th"><b>Команда ${t}</b><span>${players.filter(p => p.team === t).length}/5</span></div>` +
    ROLES.map(([k, n, c, ab]) => {
      const p = players.find(p => p.team === t && p.role === k), mine = p && S.me && p.uid === S.me.uid;
      return `<button class="role ${p ? 'taken' : 'free'} ${mine ? 'mine' : ''}" ${p ? 'disabled' : ''} data-t="${t}" data-r="${k}">
        <i>${ab}</i><span><b>${n}</b><small>${p ? '@' + esc(p.username) : 'Свободно'}</small></span>
        <em>${p ? (mine ? 'Ты' : 'Занято') : 'Занять'}</em></button>`;
    }).join('') + '</div>';

  $('#app').innerHTML = `
    <h1>OLYMP CUSTOM</h1>
    <div class="sub">Кастомная игра Mobile Legends</div>
    <div class="card pf" id="openProfile" style="cursor:pointer">
      <b>${esc(P?.nick || 'Настроить профиль и аккаунт MLBB')}</b>
      <small class="mut">${P?.mlbbId ? `ID: ${P.mlbbId} (Zone: ${P.mlbbZone})` : 'Нажмите, чтобы ввести ID и Zone ID аккаунта'}</small>
    </div>
    <div class="card stat"><div class="eye">Статус лобби</div><b>${full ? 'Лобби заполнено' : count + ' / 10'}</b><div class="bar"><i style="width:${count*10}%"></i></div></div>
    ${S.me ? `<div class="card me"><h2>Команда ${S.me.team}, ${roleName(S.me.role)}</h2><button id="rel" class="btn sec">Освободить роль</button></div>` : ''}
    <div class="teams">${team(1)}${team(2)}</div>
    <div class="tabs">${TABS.map(([k, n]) => `<button class="tab${k === tab ? ' on' : ''}" data-tab="${k}">${n}</button>`).join('')}</div>
  `;
}

document.addEventListener('click', async e => {
  const tb = e.target.closest('.tab');
  if (tb) {
    tab = tb.dataset.tab; render(); if (tab === 'custom') loadLobby();
    return;
  }
  if (e.target.closest('#openProfile')) return openProfileModal();
  const rBtn = e.target.closest('.role.free');
  if (rBtn) {
    if (!P || !P.mlbbId) { toast('Сначала укажи игровой ID и Zone ID!'); return openProfileModal(); }
    const r = await api('claim', 'POST', { team: +rBtn.dataset.t, role: rBtn.dataset.r });
    if (r.ok) { S = r; render(); toast('Роль успешно занята!'); } else { toast(r.error || 'Ошибка'); }
  }
  if (e.target.id === 'rel') {
    const r = await api('release', 'POST');
    if (r.ok) { S = r; render(); toast('Роль освобождена'); }
  }
});

function openProfileModal() {
  const sh = sheet(`
    <h2>Профиль MLBB</h2>
    <p class="mut">Введите ID и Zone ID для определения аккаунта.</p>
    <label class="mut">Игровой ID</label><input id="mlId" value="${P?.mlbbId || ''}" placeholder="12345678">
    <label class="mut">Zone ID</label><input id="mlZone" value="${P?.mlbbZone || ''}" placeholder="1234">
    <label class="mut">Ник в игре</label><input
