<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>OLYMP CUSTOM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060608;--card:#0d0d10;--ink:#f5f5f6;--mut:#7d7d85;--ln:rgba(255,255,255,.09);--red:#ff2d3b;--g:255,45,59;
--sb:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
--st:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px));
--d:"Unbounded",system-ui,sans-serif;--m:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 13px/1.5 var(--m)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 40vmax at 0 0,rgba(var(--g),.16),transparent),radial-gradient(50vmax 40vmax at 100% 100%,rgba(var(--g),.12),transparent)}
button,input{font-family:var(--m)}
.hud{--c:rgba(255,45,59,.75);position:fixed;inset:8px;z-index:1;pointer-events:none;background:
linear-gradient(var(--c),var(--c)) 0 0/14px 1.5px,linear-gradient(var(--c),var(--c)) 0 0/1.5px 14px,
linear-gradient(var(--c),var(--c)) 100% 0/14px 1.5px,linear-gradient(var(--c),var(--c)) 100% 0/1.5px 14px,
linear-gradient(var(--c),var(--c)) 0 100%/14px 1.5px,linear-gradient(var(--c),var(--c)) 0 100%/1.5px 14px,
linear-gradient(var(--c),var(--c)) 100% 100%/14px 1.5px,linear-gradient(var(--c),var(--c)) 100% 100%/1.5px 14px;background-repeat:no-repeat}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 22px) 20px 0;min-height:100dvh;overflow-anchor:none}
#vb{transition:opacity .18s}#vb.busy{opacity:.45;pointer-events:none}
#ld{position:fixed;left:0;right:0;top:0;z-index:8;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);background-size:40% 100%;background-repeat:no-repeat;opacity:0;transition:opacity .15s;animation:ld 1s linear infinite}
#ld.on{opacity:1}@keyframes ld{from{background-position:-40% 0}to{background-position:140% 0}}
.top,.rh,.th{display:flex;justify-content:space-between;align-items:center;gap:12px}
.m{font:600 10px var(--m);letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.sub,small{color:var(--mut)}
h1{margin:26px 0 8px;font:900 clamp(24px,8vw,36px)/1.08 var(--d);text-transform:uppercase;letter-spacing:-.02em}
.rh h1{margin-top:22px}
h2{margin:0 0 6px;font:700 15px var(--d)}
mark{position:relative;display:inline-block;padding:0 .16em;color:#fff;background:rgba(var(--g),.92);box-shadow:0 0 28px rgba(var(--g),.55);outline:1px solid rgba(255,255,255,.5);outline-offset:4px;transform-origin:left}
[data-fresh] mark{animation:draw .6s .05s cubic-bezier(.2,.8,.2,1) both}
[data-fresh] #vb{animation:rise .28s ease-out both}
@keyframes draw{from{transform:scaleX(0);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.chip{display:flex;align-items:center;gap:8px;max-width:60%;height:32px;padding:0 12px;border:1px solid var(--ln);border-radius:99px;background:var(--card);color:var(--ink);font:600 11px var(--m);cursor:pointer;overflow:hidden;white-space:nowrap}
.chip img,.acc img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.box{position:relative;margin-top:14px;padding:16px;border:1px solid var(--ln);border-radius:4px;background:var(--card)}
.box.hl{border-color:rgba(var(--g),.55);box-shadow:inset 0 0 40px rgba(var(--g),.08)}
.big{margin-top:6px;font:900 44px/1 var(--d)}.big small{font:600 14px var(--m)}.big.sm{font-size:24px}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:14px}
.seg i{height:6px;background:rgba(255,255,255,.1)}.seg i.on{background:var(--red);box-shadow:0 0 10px rgba(var(--g),.7)}
.bar{height:4px;margin:14px 0 8px;background:rgba(255,255,255,.1)}.bar i{display:block;height:100%;background:var(--red);box-shadow:0 0 10px rgba(var(--g),.7);transition:width .7s}
.teams{display:grid;gap:0}@media(min-width:720px){.teams{grid-template-columns:1fr 1fr;gap:12px}}
.th{padding-bottom:10px;border-bottom:1px solid var(--ln);font:700 12px var(--d)}.th span{font:600 11px var(--m);color:var(--mut)}
.role,.row{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--ink);text-align:left;font:inherit}
.role{cursor:pointer;min-height:58px}.role:last-child,.row:last-child{border-bottom:0}
.role i,.row i{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--ln);border-radius:4px;font:700 10px var(--m);font-style:normal;color:#aaa}
.role span b,.row span b{display:block;font:600 13px var(--m)}.role small,.row small{font-size:11px}
.role em,.row em{font:700 11px var(--m);font-style:normal;color:var(--mut)}
.role.free em{padding:6px 10px;border-radius:4px;background:rgba(var(--g),.15);color:var(--red)}
.role.taken{opacity:.55;cursor:default}.role.mine{opacity:1}.role.mine i{background:var(--red);border-color:var(--red);color:#fff}.role.mine em{color:var(--red)}
.row.top i{color:var(--red);border-color:rgba(var(--g),.5)}.row.top em{color:#fff}
.pz{margin:10px 0 0}
.btn{display:block;width:100%;height:48px;margin-top:12px;border:1px solid transparent;border-radius:4px;background:var(--red);box-shadow:0 4px 24px rgba(var(--g),.35);color:#fff;font:700 11px var(--d);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.btn{transition:transform .12s}.btn:active{transform:scale(.98)}.btn.g{background:none;box-shadow:none;border-color:rgba(255,255,255,.18)}
.nav{position:fixed;left:50%;bottom:calc(var(--sb) + 16px);z-index:4;display:flex;gap:4px;padding:4px;transform:translateX(-50%);border:1px solid var(--ln);border-radius:99px;background:rgba(13,13,16,.88);backdrop-filter:blur(12px)}
.nav button{height:36px;padding:0 15px;transition:background .18s,color .18s;border:0;border-radius:99px;background:none;color:var(--mut);font:700 11px var(--m);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.nav button.on{background:var(--red);color:#fff}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.82);backdrop-filter:blur(8px)}
.sheet{width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:22px 18px calc(var(--sb) + 20px);border-top:2px solid var(--red);border-radius:16px 16px 0 0;background:var(--card)}
.fld{display:block;margin-top:12px;padding:10px 12px;border:1px solid var(--ln);border-radius:4px;background:#09090b}
.fld:focus-within{border-color:var(--red)}
.fld span{font:600 9px var(--m);letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.fld input{display:block;width:100%;margin-top:6px;border:0;background:none;outline:0;color:#fff;font:600 16px var(--m);caret-color:var(--red)}
.acc{display:flex;align-items:center;gap:12px;margin-top:12px}.acc img{width:44px;height:44px}.acc b{display:block}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);z-index:9;transform:translateX(-50%);max-width:90%;padding:10px 16px;border:1px solid var(--red);border-radius:4px;background:#161213;color:#fff;font:600 12px var(--m)}
.credit{max-width:560px;margin:28px auto 0;padding:16px 20px calc(var(--sb) + 96px);border-top:1px solid var(--ln);color:var(--mut);font:500 10px/1.6 var(--m);text-align:center}
.credit a{color:var(--red);text-decoration:none;font-weight:700}
.chips{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:30px;padding:0 12px;border:1px solid var(--ln);border-radius:99px;background:none;color:var(--mut);font:600 11px var(--m);cursor:pointer}
.chips button.on{border-color:var(--red);background:rgba(var(--g),.15);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:14px;border:1px solid var(--ln);background:var(--ln)}
.grid div{padding:10px 12px;background:var(--card)}.grid b{display:block;margin-top:2px;font:700 14px var(--d)}
.tier{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.tier:last-child{border-bottom:0}
.tier>i{display:grid;place-items:center;height:34px;border-radius:4px;background:#222;color:var(--mut);font:900 15px var(--d);font-style:normal}
.tier.S>i{background:var(--red);color:#fff}.tier.A>i{background:rgba(var(--g),.6);color:#fff}.tier.B>i{background:rgba(var(--g),.3);color:#fff}
.hs{display:flex;flex-wrap:wrap;gap:6px}.hs img,.row i img{width:38px;height:38px;border-radius:6px;object-fit:cover}.row i img{width:100%;height:100%}
.row i:has(img){border:0}
.ar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:13px}.ar:last-child{border-bottom:0}
.ar small{display:block;font-size:11px}
.ac{display:flex;gap:6px;flex:none}
.btn.x{display:inline-block;width:auto;height:34px;margin:0;padding:0 12px;font-size:10px}
.pm{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 0;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--ink);font:600 13px var(--m);text-align:left;cursor:pointer}
.pm i{flex:none;position:relative;width:44px;height:26px;border-radius:99px;background:#2a2a2a;transition:background .2s}
.pm i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.pm.on i{background:var(--red)}.pm.on i::after{transform:translateX(18px)}
.stabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;padding:4px;border:1px solid var(--ln);border-radius:4px;background:var(--bg)}
.stab{height:40px;border:0;border-radius:3px;background:none;color:var(--mut);font:700 11px var(--m);text-transform:uppercase;cursor:pointer}
.stab.on{background:var(--red);color:#fff}
.er{min-height:18px;margin-top:6px;color:#ff6b75;font-size:12px}
.sheet .m.l{display:block;margin-top:18px}
.fld input[type=datetime-local]{color-scheme:dark}
.skl{height:58px;margin-top:10px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04)) 0 0/200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.pc{cursor:pointer}.pc .acc{margin-top:0}.pc .grid{margin-top:12px}.pc .grid div{padding:8px 10px}.pc .grid b{font-size:13px}
.pc .idl{margin-left:auto;font:600 11px var(--m);color:var(--mut);text-align:right}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-height:112px;padding:14px;border:1px solid var(--ln);border-radius:4px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer;transition:transform .12s,border-color .2s}
.tile:active{transform:scale(.97)}.tile:hover{border-color:rgba(var(--g),.45)}
.tile svg{width:26px;height:26px;stroke:var(--red);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font:700 13px var(--d)}.tile small{display:block;margin-top:2px;font-size:11px}
.tile.w{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}.tile.w div{flex:1}
.hp{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border:1px solid var(--ln);border-radius:99px;font:600 11px var(--m);white-space:nowrap}
.hp img,.ph{width:22px;height:22px;border-radius:50%;object-fit:cover}
.hp .ph{font-size:8px}.hp small{font-size:10px}.hp.nm{padding-left:10px}
.ph{display:inline-grid;place-items:center;background:#1c1c20;color:var(--mut);font:700 9px var(--m);font-style:normal}
.row i .ph{width:100%;height:100%;border-radius:0}
.tier .hs{gap:5px}
.src{margin-top:12px;font-size:10px;line-height:1.5;color:var(--mut)}.src a{color:var(--red);text-decoration:none;font-weight:700}
.bh{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.bh small{display:block;font-size:11px}.bh i{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--ln);border-radius:4px;overflow:hidden;font-style:normal}
.bh em{font:700 11px var(--m);font-style:normal;color:var(--mut);transition:transform .2s}.bh.o em{transform:rotate(90deg);color:var(--red)}
.bd{padding:2px 0 12px 48px}
.bk{margin-top:8px;padding:10px;border:1px solid var(--ln);border-radius:4px;background:#09090b}
.bk b{font:700 12px var(--m)}.bk .tg{margin-left:6px;padding:1px 6px;border-radius:99px;background:rgba(var(--g),.15);color:var(--red);font:600 9px var(--m);text-transform:uppercase}
.it{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.it span{padding:4px 8px;border:1px solid var(--ln);border-radius:4px;font:600 11px var(--m)}
.bk .m{margin-top:8px;display:block;text-transform:none;letter-spacing:0}
.rk{font:900 40px/1 var(--d)}
.empty{padding:18px 0;color:var(--mut);text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="hud"></div>
<div id="ld"></div>
<div id="app"><div id="top"></div><main id="view"><div id="vh"></div><div id="vb"></div></main></div>
<nav class="nav" id="nav"></nav>
<div class="credit">
  © 2026 OLYMP CUSTOM. Все права на материалы MLBB принадлежат <strong>Moonton</strong>.<br>
  Данные интеграции: <a href="https://github.com/ridwaanhall/rone-arena-python" target="_blank" rel="noopener">Rone Arena API</a> (разработка <strong>ridwaanhall / RoneAI</strong>).<br>
  Мета: <a href="https://mlbbhub.com" target="_blank" rel="noopener">mlbbhub.com</a>, <a href="https://www.playnews.gg" target="_blank" rel="noopener">playnews.gg</a>.<br>
  Создано при поддержке бота <a href="https://t.me/refillstorebot?start=aff_5100806492" id="refillLink">REFILL</a>
</div>

<script>
const tg = Telegram.WebApp;
tg.ready(); tg.expand();
try { tg.disableVerticalSwipes?.(); } catch {}

const ROLES = [['jungle', 'Jungle', 'JG'], ['exp', 'EXP', 'EX'], ['mid', 'Mid', 'MD'], ['gold', 'Gold', 'GD'], ['roam', 'Roam', 'RM']];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const roleName = k => ROLES.find(r => r[0] === k)?.[1] || k;
const myUid = () => String(tg.initDataUnsafe?.user?.id ?? '');

let S = { players: [], count: 0, me: null, admin: false, mvpRp: 25 }, P = null, R = null, tab = 'home', acc = {}, pend = 0;
const mf = { rank: 'mythic', days: 7, sort: 'wr', sec: 'tier', lane: 'all' }, MC = {}, openB = new Set();
let lastM = null;

// ── Сеть: таймаут, индикатор загрузки сверху ──
let busyN = 0;
const busy = on => { busyN += on ? 1 : -1; $('#ld').classList.toggle('on', busyN > 0); };
async function api(path, method = 'GET', body) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 12000);
  try {
    const r = await fetch('/api/' + path, { method, body: body && JSON.stringify(body), signal: ac.signal,
      headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg.initData } });
    return { ok: r.ok, status: r.status, ...await r.json().catch(() => ({})) };
  } catch { return { ok: false, error: 'Нет связи с сервером' }; } finally { clearTimeout(t); }
}
const bg = async fn => { busy(1); try { return await fn(); } finally { busy(0); } };
const loadProfile = async () => { const r = await api('profile'); if (r.ok) P = r.profile; };
const loadLobby = async () => { const r = await api('lobby'); if (r.ok) S = r; };
const loadRating = () => bg(async () => { const r = await api('rating'); if (r.ok) R = r; });
const metaKey = () => mf.rank + mf.days;
const loadMeta = () => bg(async () => {
  if (MC[metaKey()]?.error) delete MC[metaKey()];
  const k = metaKey(), r = await api(`meta?rank=${mf.rank}&days=${mf.days}`);
  if (r.ok) MC[k] = r; else if (!lastM) MC[k] = { error: r.error || 'Не удалось загрузить' };
});

const tap = () => { try { tg.HapticFeedback?.impactOccurred('light'); } catch {} };
function toast(t) {
  const e = document.createElement('div'); e.className = 'toast'; e.textContent = t;
  document.body.append(e); setTimeout(() => e.remove(), 2600);
}
function sheet(html) {
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = '<div class="sheet">' + html + '</div>';
  o.onclick = e => { if (e.target === o) o.remove(); };
  document.body.append(o); return o.firstChild;
}
const fld = (label, id, ph, v) => `<label class="fld"><span>${label}</span><input id="${id}" value="${esc(v)}" placeholder="${ph}" inputmode="numeric" autocomplete="off"></label>`;

// ── Кольцо: сколько дней осталось до конца сезона ──
const ring = (left, total) => {
  const c = 2 * Math.PI * 24, f = Math.max(0, Math.min(1, left / (total || 1)));
  return `<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/>
  <circle cx="28" cy="28" r="24" fill="none" stroke="#ff2d3b" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 28 28)"/>
  <text x="28" y="32" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-weight="800" font-size="12">${left}д</text></svg>`;
};
const skel = n => Array.from({ length: n }, () => '<div class="skl"></div>').join('');

// ── Профиль игрока (карточка с ID, рангом, максимальным рангом и винрейтом) ──
const cell = (l, v) => `<div><span class="m">${l}</span><b>${esc(v ?? '—')}</b></div>`;
const wrTxt = st => st?.wr != null ? st.wr + '%' : null;
function pcard() {
  if (!P?.mlbbId) return `<div class="box pc" data-a="profile"><div class="m">Профиль MLBB</div><h2 style="margin-top:8px">Привяжи аккаунт</h2><div class="sub">Укажи ID и Zone ID, чтобы занимать роли и видеть свой ранг.</div><button class="btn" style="margin-top:12px">Привязать</button></div>`;
  const st = P.stats;
  return `<div class="box hl pc" data-a="profile"><div class="acc">${P.avatar ? `<img src="${esc(P.avatar)}" alt="" referrerpolicy="no-referrer">` : ''}
    <div><b>${esc(P.nick || 'Игрок')}${P.verified ? ' ✓' : ''}</b><small>${P.verified ? 'Аккаунт подтверждён' : 'Не подтверждён'}${P.level ? ' · ур. ' + esc(P.level) : ''}</small></div>
    <div class="idl">ID<br><b style="color:var(--ink)">${esc(P.mlbbId)}</b> (${esc(P.mlbbZone)})</div></div>
    ${(P.verified || st?.rank) ? `<div class="grid" style="grid-template-columns:repeat(3,1fr)">${cell('Ранг', st?.rank)}${cell('Макс. ранг', st?.best)}${wrTxt(st) ? cell('Винрейт', wrTxt(st)) : cell('Уровень', P.level)}</div>
      ${!st ? '<div class="sub" style="margin-top:8px;font-size:11px">Ранг пока не получен. Открой профиль и нажми «Обновить данные из игры».</div>' : ''}`
      : '<div class="sub" style="margin-top:10px;font-size:11px">Подтверди аккаунт кодом из игровой почты, и здесь появятся ранг и максимальный ранг.</div>'}</div>`;
}

// ── Экраны ──
const ICON = {
  lobby: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17 14.2c2.3.3 4 2.2 4 4.8"/></svg>',
  rating: '<svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5"/><path d="M12 14v4M8.5 20h7"/></svg>',

function buildsBody(M) {

      ${o ? `<div class="bd">${b.builds.map(x => `<div class="bk"><b>${esc(x.name)}</b><span class="tg">${x.kind === 'curated' ? 'подборка' : 'игроки'}</span>

// ── Отрисовка без мерцания: каждый блок обновляется только если его HTML изменился ──
function setHTML(el, html) {
  if (el._h === html) return;
  const sc = [...el.querySelectorAll('.chips')].map(c => c.scrollLeft);
  el.innerHTML = html; el._h = html;
  el.querySelectorAll('.chips').forEach((c, i) => { c.scrollLeft = sc[i] || 0; });
}
const TABS = [['home', 'Меню'], ['custom', 'Лобби'], ['rating', 'Рейтинг'], ['meta', 'Мета']];
let freshT;
let render = function () {
  const top = `<div class="top"><span class="m">● Olymp custom</span><button class="chip" data-a="profile">${P?.avatar ? `<img src="${esc(P.avatar)}" alt="" referrerpolicy="no-referrer">` : ''}${esc(P?.mlbbId ? P.nick + (P.verified ? ' ✓' : '') : 'Указать MLBB ID')}</button></div>`;
  setHTML($('#top'), top);
  const v = ({ home: homeView, custom: lobbyView, rating: ratingView, meta: metaView }[tab] || homeView)(), view = $('#view');
  if (view.dataset.tab !== tab) { // «плашка» и появление контента играют только при смене раздела
    view.dataset.tab = tab; view.dataset.fresh = 1; clearTimeout(freshT); freshT = setTimeout(() => delete view.dataset.fresh, 900); scrollTo(0, 0);
  }
  setHTML($('#vh'), v.head); setHTML($('#vb'), v.body);
  $('#vb').classList.toggle('busy', !!v.stale);
  const nav = $('#nav');
  if (!nav.firstChild) nav.innerHTML = TABS.map(([k, n]) => `<button data-a="tab" data-v="${k}">${n}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === tab));
};
// Раздел открывается мгновенно с тем, что уже есть, а свежие данные подтягиваются тихо
const LOADERS = { home: () => Promise.all([loadLobby(), loadRating()]), custom: loadLobby, rating: loadRating, meta: loadMeta };
async function go(t) {
  tab = t; render();
  await LOADERS[t]?.(); if (tab === t) { if (t === 'meta') lastM = MC[metaKey()] || lastM; render(); }
}

// ── Профиль: ID + Zone + ник. Подтверждение через игру добавляет ранг, винрейт и героев ──
function profileSheet(step) {
  step = step || 'main';
  const st = P?.stats;
  const card = (P?.verified || P?.stats?.rank) ? `<div class="acc">${P.avatar ? `<img src="${esc(P.avatar)}" alt="" referrerpolicy="no-referrer">` : ''}<div><b>${esc(P.nick)}${P.verified ? ' ✓' : ''}</b><small>${P.verified ? 'Аккаунт подтверждён' : 'Ранг получен через Yanjiestore'} · ур. ${esc(P.level ?? '—')}${st?.at ? ' · данные от ' + new Date(st.at).toLocaleDateString('ru') : ''}</small></div></div>
    <div class="grid">${cell('ID', P.mlbbId + ' (' + P.mlbbZone + ')')}${cell('Уровень', P.level)}${cell('Ранг', st?.rank)}${cell('Макс. ранг', st?.best)}${[['Винрейт', wrTxt(st)], ['Матчей', st?.matches], ['MVP', st?.mvp], ['Серия побед', st?.streak], ['Часов в игре', st?.hours]].filter(x => x[1] != null).map(x => cell(...x)).join('')}</div>
    ${st?.heroes?.length ? `<div class="th" style="margin-top:14px"><b>Любимые герои</b><span>WR</span></div>${st.heroes.map(h => `<div class="row"><i>${h.img ? `<img src="${esc(h.img)}" alt="" referrerpolicy="no-referrer">` : ''}</i><span><b>${esc(h.n)}</b><small>${esc(h.m)} матчей</small></span><em>${h.wr}%</em></div>`).join('')}` : ''}` : '';
  const html = {
    main: `<h2>Профиль MLBB</h2><p class="sub">Укажи ID и Zone ID. Ник можно менять в любой момент.</p>${fld('Игровой ID', 'mlId', '12345678', P?.mlbbId)}${fld('Zone ID', 'mlZone', '1234', P?.mlbbZone)}
      <label class="fld"><span>Ник</span><input id="mlNick" value="${esc(P?.nick)}" placeholder="Твой ник" maxlength="24" autocomplete="off"></label>
      <button class="btn" id="save">Сохранить</button>
      <button class="btn g" id="rankLookup">Определить ранг точнее</button>
      ${P?.mlbbId ? `<button class="btn g" id="verify">${P.verified ? 'Обновить данные из игры' : 'Подтвердить через игру'}</button>${P.verified ? '' : '<p class="sub">Подтверждение покажет твой ранг и максимальный ранг.</p>'}` : ''}${card}`,
    code: `<h2>Код из игровой почты</h2><p class="sub">Открой почту в MLBB. Код действует 5 минут.</p>${fld('Код', 'mlCode', '000000')}<button class="btn" id="ver">Подтвердить</button>`,
  }[step];
  const sh = sheet(html), close = () => sh.parentNode.remove(), on = (id, fn) => { const b = sh.querySelector(id); if (b) b.onclick = fn; };
  on('#save', async () => {
    const r = await api('profile', 'POST', { mlbbId: $('#mlId').value.trim(), mlbbZone: $('#mlZone').value.trim(), nick: $('#mlNick').value.trim() });
    if (r.ok) { P = r.profile; close(); render(); toast('Профиль сохранён'); } else toast(r.error || 'Ошибка');
  });
  on('#rankLookup', async () => {
    const mlbbId = $('#mlId').value.trim(), mlbbZone = $('#mlZone').value.trim();
    if (!mlbbId || !mlbbZone) return toast('Сначала укажи игровой ID и Zone ID');
    const r = await api('mlbb/rank-lookup', 'POST', { mlbbId, mlbbZone });
    if (r.ok) { P = r.profile; close(); render(); toast('Ранг обновлён: ' + r.rank); profileSheet(); }
    else toast(r.error || 'Не удалось определить ранг');
  });
  on('#verify', async () => {
    acc = { id: $('#mlId').value.trim(), zone: $('#mlZone').value.trim() };
    const r = await api('mlbb/send-code', 'POST', { mlbbId: acc.id, mlbbZone: acc.zone });
    if (r.ok) { close(); profileSheet('code'); toast('Код отправлен в игровую почту'); } else toast(r.error || 'Ошибка');
  });
  on('#ver', async () => {
    const r = await api('mlbb/verify', 'POST', { mlbbId: acc.id, mlbbZone: acc.zone, code: $('#mlCode').value.trim() });
    if (r.ok) { P = r.profile; close(); render(); toast('Аккаунт подтверждён'); profileSheet(); } else toast(r.error || 'Ошибка');
  });
}

// Открывает лист, закрывая предыдущий; keep = сохранить прокрутку при обновлении того же листа

  const sh = asheet(`<h2>Управление игрой</h2><p class="sub">Твоя роль: ${ROLE_NAME[S.role] || '—'}</p>` +
    (can('time') ? hf('Старт игры (Бишкек, UTC+6)', 'dt', '', S.startsAt ? loc(S.startsAt) : '', 'datetime-local') +
      '<div class="er" id="er"></div><button class="btn" id="sv">Сохранить время</button><button class="btn g" id="cl">Убрать время</button>' : '') +
    (can('room') ? hf('Код комнаты (видят игроки с ролью)', 'rm', 'например 12345678', S.roomCode || '') + '<button class="btn g" id="rmb">Сохранить код</button>' : '') +
    (can('broadcast') ? hf('Сообщение игрокам с ролью', 'bc', 'Текст рассылки') + '<button class="btn g" id="bcb">Отправить всем</button><button class="btn g" id="rmd">Напомнить не подтвердившим</button>' : '') +
    (can('lock') ? `<button class="btn g" id="lk">${S.locked ? 'Открыть набор' : 'Закрыть набор'}</button>` : '') +
    '<div class="m l">Игроки</div>' +
    (S.players.length ? S.players.map(p => `<div class="ar"><span><b>${esc(p.name || p.username)}</b><small>К${p.team}, ${esc(roleName(p.role))}</small></span><span class="ac">` +
      (can('kick') ? `<button class="btn g x" data-k="${esc(p.uid)}">Убрать</button>` : '') +
      (can('ban') ? `<button class="btn g x" data-b="${esc(p.uid)}" data-n="${esc(p.name || p.username)}">Бан</button>` : '') + '</span></div>').join('') : '<p class="sub">Пока никого.</p>') +
    (can('reset') ? '<button class="btn g" id="rs">Сбросить лобби</button>' : '') + '<button class="btn" id="no">Закрыть</button>', keep);
  const act = async (path, body, ok) => {
    const r = await api('admin/' + path, 'POST', body);
    if (!r.ok) return toast(em(r));
    if (r.players) { S = r; render(); }
    toast(typeof ok === 'function' ? ok(r) : ok); openAdmin(true);
  };
  bind(sh, '#sv', () => {
    const v = sh.querySelector('#dt').value;
    if (!v) return void (sh.querySelector('#er').textContent = 'Выбери дату и время.');
    act('time', { startsAt: new Date(v + ':00+06:00').toISOString() }, 'Время сохранено');
  });
  bind(sh, '#cl', () => act('time', { startsAt: null }, 'Время убрано'));
  bind(sh, '#rmb', () => act('room', { code: sh.querySelector('#rm').value }, 'Код сохранён'));
  bind(sh, '#bcb', () => { const t = sh.querySelector('#bc').value.trim(); if (t) act('broadcast', { text: t }, r => `Рассылка отправлена: ${r.sent}`); });
  bind(sh, '#rmd', () => act('remind', {}, r => `Напоминание отправлено: ${r.sent}`));
  bind(sh, '#lk', () => act('lock', { locked: !S.locked }, S.locked ? 'Набор открыт' : 'Набор закрыт'));
  sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => act('kick', { uid: b.dataset.k }, 'Игрок убран'));
  sh.querySelectorAll('[data-b]').forEach(b => b.onclick = () => ask(`Забанить ${b.dataset.n}? Он потеряет роли во всех играх и не сможет занимать новые.`,
    () => act('ban', { uid: b.dataset.b, username: b.dataset.n }, 'Игрок забанен')));
  bind(sh, '#rs', () => ask('Сбросить лобби? Все роли освободятся.', () => act('reset', {}, 'Лобби сброшено')));
  bind(sh, '#no', closeAll);
}

// ---- Глобальная админ-панель ----
function openPanel(keep) {
  const sh = asheet(`<h2>Админ-панель</h2><p class="sub">Твоя роль: ${ROLE_NAME[S.role] || '—'}</p>` +
    PANEL.filter(([p]) => can(p)).map(([p, n]) => `<button class="btn g" data-o="${p}">${n}</button>`).join('') + '<button class="btn" id="no">Закрыть</button>', keep);
  sh.querySelectorAll('[data-o]').forEach(b => b.onclick = () => PANEL.find(x => x[0] === b.dataset.o)[2]());
  bind(sh, '#no', closeAll);
}

async function openStaff(keep) {
  const r = await api('admin/staff');
  if (!r.ok) return void toast(em(r));
  const nm = x => x.handle ? '@' + esc(x.handle) : 'id ' + esc(x.uid);
  const sh = asheet(`<h2>Персонал и права</h2><p class="sub">Владельцы заданы на сервере (переменная ADMINS): у них всегда все права, убрать их здесь нельзя. Остальным права выдаёшь ты, по каждому отдельно.</p>
    <div class="m l">Владельцы</div>` +
    (r.owners.length ? r.owners.map(o => `<div class="ar"><span>${/^\d+$/.test(o) ? 'id ' : '@'}${esc(o)}</span><small>Владелец</small></div>`).join('') : '<p class="sub">Не заданы.</p>') +
    '<div class="m l">Админы и модераторы</div>' +
    (r.staff.length ? r.staff.map(x => `<div class="ar"><span><b>${nm(x)}</b><small>${ROLE_NAME[x.role]} · прав: ${x.perms.length}${x.uid ? '' : ' · ждёт первого входа'}</small></span><button class="btn g x" data-e="${x.id}">Изменить</button></div>`).join('') : '<p class="sub">Пока никого.</p>') +
    '<button class="btn" id="sa">Добавить сотрудника</button><button class="btn g" id="bk">Назад</button>', keep);
  bind(sh, '#sa', () => openStaffEdit(r, null));
  sh.querySelectorAll('[data-e]').forEach(b => b.onclick = () => openStaffEdit(r, r.staff.find(x => x.id === +b.dataset.e)));
  bind(sh, '#bk', openPanel);
}

function openStaffEdit(D, row) {
  let role = row ? row.role : 'mod';
  const perms = new Set(row ? row.perms : D.presets.mod);
  const sh = asheet(`<h2>${row ? 'Права сотрудника' : 'Новый сотрудник'}</h2>` +
    (row ? `<p class="sub">${row.handle ? '@' + esc(row.handle) : 'id ' + esc(row.uid)}</p>` : hf('Telegram @username или числовой id', 'sh', '@username')) +
    `<div class="stabs" id="rl"></div><div class="m l">Права</div><div id="pl"></div><div class="er" id="er"></div>
    <button class="btn" id="sv">Сохранить</button>${row ? '<button class="btn g" id="rm">Убрать из персонала</button>' : ''}<button class="btn g" id="bk">Назад</button>`);
  const draw = () => {
    sh.querySelector('#rl').innerHTML = ['admin', 'mod'].map(k => `<button class="stab${k === role ? ' on' : ''}" data-r="${k}">${ROLE_NAME[k]}</button>`).join('');
    sh.querySelector('#pl').innerHTML = PERMS.map(([k, n]) => `<button class="pm${perms.has(k) ? ' on' : ''}" data-p="${k}"><span>${n}</span><i></i></button>`).join('');
  };
  draw();
  sh.querySelector('#rl').onclick = e => { // смена роли подставляет права по умолчанию, дальше их можно менять
    const b = e.target.closest('[data-r]');
    if (!b || b.dataset.r === role) return;
    role = b.dataset.r; perms.clear(); D.presets[role].forEach(p => perms.add(p)); draw();
  };
  sh.querySelector('#pl').onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    perms.has(b.dataset.p) ? perms.delete(b.dataset.p) : perms.add(b.dataset.p); draw();
  };
  bind(sh, '#bk', openStaff);
  bind(sh, '#sv', async () => {
    const r = await api('admin/staff/save', 'POST', { role, perms: [...perms], ...(row ? { id: row.id } : { handle: sh.querySelector('#sh').value }) });
    if (!r.ok) return void (sh.querySelector('#er').textContent = em(r));
    toast('Сохранено'); openStaff();
  });
  bind(sh, '#rm', () => ask('Убрать из персонала? Права пропадут сразу.', async () => {
    const r = await api('admin/staff/remove', 'POST', { id: row.id });
    if (r.ok) { toast('Убран из персонала'); openStaff(); } else toast(em(r));
  }));
}

async function openBans() {
  const r = await api('admin/bans');
  if (!r.ok) return void toast(em(r));
  const sh = asheet('<h2>Баны</h2><p class="sub">Забаненные не могут занимать роли. Забанить можно в «Управлении игрой», кнопка «Бан» рядом с игроком.</p>' +
    (r.bans.length ? r.bans.map(b => `<div class="ar"><span><b>${b.username ? '@' + esc(b.username) : 'id ' + esc(b.uid)}</b><small>${fmtShort(b.at)}</small></span><button class="btn g x" data-u="${esc(b.uid)}">Разбанить</button></div>`).join('') : '<p class="sub">Список пуст.</p>') +
    '<button class="btn g" id="bk">Назад</button>');
  sh.querySelectorAll('[data-u]').forEach(b => b.onclick = async () => {
    const x = await api('admin/unban', 'POST', { uid: b.dataset.u });
    if (x.ok) { toast('Разбанен'); openBans(); } else toast(em(x));
  });
  bind(sh, '#bk', openPanel);
}

async function openLog() {
  const r = await api('admin/log');
  if (!r.ok) return void toast(em(r));
  const sh = asheet('<h2>Журнал действий</h2><p class="sub">Последние 60 действий персонала.</p>' +
    (r.log.length ? r.log.map(e => `<div class="ar"><span><b>${e.actorName ? '@' + esc(e.actorName) : 'id ' + esc(e.actorId)}</b> <small style="display:inline">${esc(ROLE_NAME[e.role] || '')}</small><br>${esc(ACT[e.action] || e.action)}${e.lobbyId ? ` <small style="display:inline">· игра №${e.lobbyId}</small>` : ''}` +
      `${e.detail ? `<small style="word-break:break-word">${esc(e.detail.slice(0, 120))}</small>` : ''}</span><small>${fmtShort(e.at)}</small></div>`).join('') : '<p class="sub">Пока пусто.</p>') +
    '<button class="btn g" id="bk">Назад</button>');
  bind(sh, '#bk', openPanel);
}

function finishSheet() {
  const sh = sheet(`<h2>Кто MVP матча?</h2><p class="sub">+${S.mvpRp} RP игроку. Лобби очистится.</p>
    ${S.players.map(p => `<button class="role free" data-u="${esc(p.uid)}"><i>${p.team}</i><span><b>${esc(p.name)}</b><small>${esc(roleName(p.role))}</small></span><em>MVP</em></button>`).join('')}
    <button class="btn g" data-u="">Без MVP, только очистить</button>`);
  sh.onclick = async e => {
    const b = e.target.closest('[data-u]'); if (!b) return;
    const r = await api('admin/finish', 'POST', { mvpUid: b.dataset.u || null });
    if (r.ok) { S = r; sh.parentNode.remove(); render(); toast('Матч завершён'); } else toast(r.error || 'Ошибка');
  };
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'link') { e.preventDefault(); try { tg.openLink(el.dataset.u); } catch { open(el.dataset.u, '_blank'); } return; }
  tap();
  if (a === 'tab') go(el.dataset.v);
  else if (a.startsWith('go-')) go(a.slice(3));
  else if (a === 'mf') {
    const k = el.dataset.k, v = el.dataset.v;
    if (String(mf[k]) === v) return;
    mf[k] = k === 'days' ? +v : v;
    render();
    if (k === 'rank' || k === 'days') { await loadMeta(); lastM = MC[metaKey()] || lastM; if (tab === 'meta') render(); }
  }
  else if (a === 'bo') { const h = el.dataset.v; openB.has(h) ? openB.delete(h) : openB.add(h); render(); }
  else if (a === 'profile') profileSheet();
  else if (a === 'claim') {
    if (!P?.mlbbId) { toast('Сначала укажи игровой ID и Zone ID'); return profileSheet(); }
    if (S.me) return toast('Сначала освободи свою текущую роль');
    const team = +el.dataset.t, role = el.dataset.r, prev = S, mine = { uid: myUid(), name: P.nick || 'Ты', username: '', team, role, confirmed: false };
    pend++; S = { ...S, count: S.count + 1, players: [...S.players, mine], me: mine }; render(); // роль занимается сразу, сервер подтвердит следом
    const r = await api('claim', 'POST', { team, role }); pend--;
    if (r.ok) { S = r; toast('Роль занята'); } else { S = prev; toast(r.error || 'Ошибка'); }
    render();
  } else if (a === 'rel') {
    const prev = S; pend++;
    S = { ...S, count: Math.max(0, S.count - 1), players: S.players.filter(p => p.uid !== myUid()), me: null }; render();
    const r = await api('release', 'POST'); pend--;
    if (r.ok) { S = r; toast('Роль освобождена'); } else { S = prev; toast(r.error || 'Ошибка'); }
    render();
  }
  else if (a === 'finish') finishSheet();
  else if (a === 'gadm') openAdmin();
  else if (a === 'pnl') openPanel();
});

let ready = false;
const _render = render;
render = function () { // до первой загрузки показываем заглушку, чтобы карточки не прыгали
  if (ready) return _render();
  setHTML($('#vh'), ''); setHTML($('#vb'), skel(4));
};

(async () => {
  render();
  await Promise.all([loadProfile(), loadLobby()]); ready = true; render();
  loadRating().then(render); // остальные разделы прогреваются заранее, чтобы открываться мгновенно
  loadMeta().then(() => { lastM = MC[metaKey()] || lastM; if (tab === 'meta') render(); });
  const poll = async () => { // лобби обновляется само, только когда оно на виду
    if (document.hidden || pend || $('.ov') || !['custom', 'home'].includes(tab)) return;
    await loadLobby(); if (!pend && !$('.ov')) render();
  };
  setInterval(poll, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
})();
</script>
