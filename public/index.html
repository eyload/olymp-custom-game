<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>OLYMP CUSTOM BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0507;--card:#150a0e;--card2:#1c0d13;--line:#3a1620;--red:#ff3b4e;--red2:#c4122c;--rose:#ff8a96;--amber:#ffb454;--mut:#a58a90;
--sb:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
--st:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px));
--fd:"Unbounded","Onest",system-ui,sans-serif;--fb:"Onest",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:#fff;font:500 16px/1.4 var(--fb);
background:repeating-linear-gradient(115deg,rgba(255,60,80,.035) 0 1px,transparent 1px 18px),radial-gradient(90% 42% at 50% -4%,rgba(196,18,44,.4),transparent 70%),radial-gradient(70% 30% at 100% 100%,rgba(120,10,30,.28),transparent 70%),var(--bg)}
button,input{font-family:var(--fb)}
#app{max-width:880px;margin:0 auto;padding:20px 16px calc(var(--sb) + 32px)}
h1{margin:6px 0 4px;font:700 clamp(20px,6vw,28px)/1.15 var(--fd);letter-spacing:.03em;background:linear-gradient(180deg,#fff 30%,#ff9aa5);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,59,78,.45))}
h2{margin:0 0 6px;font:600 17px/1.25 var(--fd);letter-spacing:.01em}
.mut,small{color:var(--mut)}.eye{color:var(--rose);font:600 10.5px var(--fd);letter-spacing:.2em}
.card{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.35)}
.card::before{content:"";position:absolute;left:12%;right:12%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.85}
.stat b{font:600 16px var(--fd)}.bar{height:8px;border-radius:8px;background:#2a1118;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red),#ff8a4c);border-radius:8px;box-shadow:0 0 12px var(--red);transition:width .4s}
.stat.done{border-color:var(--red);box-shadow:0 0 30px rgba(255,59,78,.3),inset 0 1px 0 rgba(255,255,255,.05)}.stat.done b{color:var(--rose)}
.me{border-color:rgba(255,180,84,.5);box-shadow:0 0 24px rgba(255,180,84,.12)}.me::before{background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.teams{display:grid;gap:0 16px}@media(min-width:720px){.teams{grid-template-columns:1fr 1fr}}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font:600 14px var(--fd);letter-spacing:.06em}
.th span{color:var(--mut);font:600 14px var(--fb);letter-spacing:0}
.role{width:100%;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;text-align:left;color:#fff;background:linear-gradient(90deg,#210f16,#180b10);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:8px;min-height:66px;font:inherit;transition:transform .12s,border-color .2s,opacity .2s,box-shadow .2s}
.role i{position:relative;overflow:hidden;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:600 11px/1 var(--fd);font-style:normal;color:var(--c);background:#0c0508;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 22%,transparent)}
.role i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.role span b{display:block;font:600 13px var(--fd);letter-spacing:.05em}.role small{font-weight:600}
.role em{font:600 11px var(--fd);letter-spacing:.04em;font-style:normal;padding:9px 16px;border-radius:12px}
.role.free{cursor:pointer;border-color:color-mix(in srgb,var(--c) 28%,var(--line))}
.role.free em{background:linear-gradient(180deg,var(--red),var(--red2));color:#fff;box-shadow:0 4px 14px rgba(255,59,78,.35)}.role.free:active{transform:scale(.98)}
.role.taken{opacity:.5;background:#100609;cursor:default}.role.taken em{color:var(--mut)}
.role.mine{opacity:1;border-color:var(--amber);box-shadow:0 0 16px rgba(255,180,84,.18)}.role.mine em{color:var(--amber)}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:16px;font:600 13px var(--fd);letter-spacing:.04em;margin-top:10px;color:#fff;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4}
.pri{background:linear-gradient(180deg,var(--red),var(--red2));box-shadow:0 6px 20px rgba(255,59,78,.35)}.sec{background:#27121a;border:1px solid var(--line)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:f .18s}
.sheet{width:100%;max-width:520px;background:linear-gradient(180deg,#1f0e15,#12080b);border:1px solid var(--line);border-bottom:0;border-top-color:rgba(255,59,78,.55);border-radius:28px 28px 0 0;padding:22px 18px calc(var(--sb) + 18px);box-shadow:0 -10px 40px rgba(196,18,44,.2);animation:u .22s ease-out}
.sheet p{margin:6px 0}.sheet input{width:100%;height:54px;margin-top:6px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:#0c0508;color:#fff;font-size:16px;outline:0;color-scheme:dark}
.sheet input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,78,.18)}
#er{color:#ff7a86;font-size:14px;min-height:20px;margin-top:6px}
.ok{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#fff;background:linear-gradient(180deg,var(--red),var(--red2));box-shadow:0 0 24px rgba(255,59,78,.5);margin-bottom:10px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%);z-index:9;background:#241017;border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;max-width:92%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:f .2s}.toast.err{border-color:#ff5a6a}.toast.good{border-color:var(--amber)}
.gate{padding:30vh 8px 0;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.x{width:auto;min-height:36px;padding:0 12px;margin:0;font-size:12px}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const tg = Telegram.WebApp;
tg.ready(); tg.expand();
try { tg.setHeaderColor('#0a0507'); tg.setBackgroundColor('#0a0507'); } catch {}

const ROLES = [['jungle','JUNGLE','#f87171','JG'],['exp','EXP','#fb923c','EX'],['mid','MID','#a78bfa','MD'],['gold','GOLD','#facc15','GD'],['roam','ROAM','#38bdf8','RM']];
const MSG = {
  role_taken:'Эта роль уже занята.', has_role:'Ты уже занял роль.', full:'Лобби уже заполнено.',
  bad_username:'Username: 5–32 символа, латиница, цифры и _.', auth:'Не удалось подтвердить вход через Telegram.',
  network:'Нет соединения. Попробуй ещё раз.', db:'Ошибка сервера. Попробуй ещё раз.', bad_time:'Укажи время в будущем.', forbidden:'Нет доступа.'
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const roleName = k => ROLES.find(r => r[0] === k)[1];
let S = { players: [], count: 0, me: null }, loaded = false, last = '';

async function api(path, method = 'GET', body) {
  try {
    const r = await fetch('/api/' + path, { method, body: body && JSON.stringify(body),
      headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg.initData } });
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, ...j };
  } catch { return { ok: false, error: 'network' }; }
}

function toast(t, kind) {
  const e = document.createElement('div');
  e.className = 'toast ' + (kind || ''); e.textContent = t; document.body.append(e);
  try { tg.HapticFeedback.notificationOccurred(kind === 'err' ? 'error' : 'success'); } catch {}
  setTimeout(() => e.remove(), 2800);
}

function sheet(html) {
  closeSheet();
  const o = document.createElement('div');
  o.className = 'ov'; o.innerHTML = '<div class="sheet">' + html + '</div>';
  o.onclick = e => { if (e.target === o) closeSheet(); };
  document.body.append(o); tg.BackButton.show();
  return o.firstChild;
}
function closeSheet() { $('.ov')?.remove(); tg.BackButton.hide(); }
tg.BackButton.onClick(closeSheet);

function render() {
  const { players, count, me } = S, full = count >= 10;
  const team = t => `<section class="card"><div class="th"><b>КОМАНДА ${t}</b><span>${players.filter(p => p.team === t).length} / 5</span></div>` +
    ROLES.map(([k, n, c, ab]) => {
      const p = players.find(p => p.team === t && p.role === k), mine = p && me && p.uid === me.uid;
      return `<button class="role ${p ? 'taken' : 'free'} ${mine ? 'mine' : ''}" style="--c:${c}" ${p ? 'disabled' : ''} data-t="${t}" data-r="${k}">
        <i>${ab}<img src="roles/${k}.png" alt="" onload="this.parentNode.style.color='transparent'" onerror="this.remove()"></i><span><b>${n}</b><small>${p ? '@' + esc(p.username) : 'Свободно'}</small></span>
        <em>${p ? (mine ? 'Ты' : 'Занято') : 'Занять'}</em></button>`;
    }).join('') + '</section>';
  $('#app').innerHTML = `
    <div class="eye">MOBILE LEGENDS</div><h1>OLYMP CUSTOM BOT</h1><div class="mut">Собираем команду 5 × 5</div>
    <div class="card stat ${full ? 'done' : ''}"><b>${full ? 'Команда собрана!' : count + ' / 10 игроков'}</b>
      ${full ? `<small> 10 / 10 игроков</small>` : ''}<div class="bar"><i style="width:${count * 10}%"></i></div></div>
    <div class="card"><div class="eye">СТАРТ ИГРЫ</div><h2>${S.startsAt ? fmt(S.startsAt) : 'Время пока не назначено'}</h2>
      <small>Игроки с ролью получат напоминания за 20 и 10 минут.</small>${S.isAdmin ? '<button id="adm" class="btn sec">Админ-панель</button>' : ''}</div>
    ${me ? `<div class="card me"><div class="eye">ТВОЯ РОЛЬ</div><h2>Команда ${me.team} · ${roleName(me.role)}</h2>
      <div class="mut">@${esc(me.username)}</div><button id="rel" class="btn sec">Освободить роль</button></div>` : ''}
    <div class="teams">${team(1)}${team(2)}</div>`;
}

$('#app').addEventListener('click', e => {
  const b = e.target.closest('.role.free');
  if (b) return openClaim(+b.dataset.t, b.dataset.r);
  if (e.target.id === 'rel') openRelease();
  if (e.target.id === 'adm') openAdmin();
});

function openClaim(team, key) {
  if (S.me) return toast(MSG.has_role, 'err');
  const u = tg.initDataUnsafe?.user?.username;
  const sh = sheet(`<h2>${roleName(key)}</h2><div class="mut">Команда ${team}</div>
    <p>Укажи Telegram username, чтобы занять эту роль.</p>
    <label class="mut">Твой Telegram username</label>
    <input id="un" placeholder="@username" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${u ? '@' + esc(u) : ''}">
    <div id="er"></div><button id="go" class="btn pri">Занять роль</button><button id="no" class="btn sec">Отмена</button>`);
  const inp = sh.querySelector('#un'), go = sh.querySelector('#go');
  const sync = () => { go.disabled = !inp.value.trim().replace(/^@/, ''); sh.querySelector('#er').textContent = ''; };
  inp.oninput = sync; sync();
  sh.querySelector('#no').onclick = closeSheet;
  go.onclick = async () => {
    go.disabled = true; go.textContent = '…';
    const r = await api('claim', 'POST', { team, role: key, username: inp.value });
    if (r.ok) {
      S = r; render();
      sh.innerHTML = `<div class="ok">✓</div><h2>Роль занята!</h2><p class="mut">Команда ${team}</p><h2>${roleName(key)}</h2>
        <div class="mut">@${esc(r.me.username)}</div><button id="done" class="btn pri">Готово</button>`;
      sh.querySelector('#done').onclick = closeSheet;
      try { tg.HapticFeedback.notificationOccurred('success'); tg.requestWriteAccess?.(); } catch {}
      return;
    }
    go.textContent = 'Занять роль'; sync();
    if (r.error === 'bad_username') return void (sh.querySelector('#er').textContent = MSG.bad_username);
    toast(MSG[r.error] || 'Не удалось занять роль. Попробуй ещё раз.', 'err');
    if (['role_taken', 'full', 'has_role'].includes(r.error)) { closeSheet(); load(); }
  };
}

function openRelease() {
  const sh = sheet(`<h2>Освободить роль?</h2><p class="mut">Команда ${S.me.team} · ${roleName(S.me.role)} снова станет доступна другим.</p>
    <button id="yes" class="btn pri">Освободить</button><button id="no" class="btn sec">Отмена</button>`);
  sh.querySelector('#no').onclick = closeSheet;
  sh.querySelector('#yes').onclick = async () => {
    const r = await api('release', 'POST');
    closeSheet();
    if (r.ok) { S = r; render(); toast('Роль освобождена.', 'good'); }
    else toast(MSG[r.error] || 'Не удалось освободить роль.', 'err');
  };
}

const fmt = d => new Date(d).toLocaleString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });

function openAdmin() {
  const loc = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };
  const sh = sheet(`<h2>Админ-панель</h2><label class="mut">Дата и время старта</label>
    <input id="dt" type="datetime-local" value="${S.startsAt ? loc(S.startsAt) : ''}"><div id="er"></div>
    <button id="sv" class="btn pri">Сохранить время</button><button id="cl" class="btn sec">Убрать время</button>
    <div class="eye" style="margin-top:20px">ИГРОКИ</div>` +
    (S.players.length ? S.players.map(p => `<div class="row"><span>К${p.team} · ${roleName(p.role)} · @${esc(p.username)}</span><button class="btn sec x" data-k="${p.uid}">Убрать</button></div>`).join('') : '<p class="mut">Пока никого.</p>') +
    `<button id="rs" class="btn sec">Сбросить лобби</button><button id="no" class="btn sec">Закрыть</button>`);
  const act = async (path, body, okText) => {
    const r = await api('admin/' + path, 'POST', body);
    if (r.ok) { S = r; render(); toast(okText, 'good'); openAdmin(); } else toast(MSG[r.error] || MSG.db, 'err');
  };
  sh.querySelector('#sv').onclick = () => {
    const v = sh.querySelector('#dt').value;
    if (!v) return void (sh.querySelector('#er').textContent = 'Выбери дату и время.');
    act('time', { startsAt: new Date(v).toISOString() }, 'Время сохранено.');
  };
  sh.querySelector('#cl').onclick = () => act('time', { startsAt: null }, 'Время убрано.');
  sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => act('kick', { uid: b.dataset.k }, 'Игрок убран.'));
  sh.querySelector('#rs').onclick = () => tg.showConfirm('Сбросить лобби? Все роли освободятся.', ok => ok && act('reset', {}, 'Лобби сброшено.'));
  sh.querySelector('#no').onclick = closeSheet;
}

async function load() {
  const r = await api('lobby');
  if (r.ok) {
    const k = JSON.stringify([r.players, r.startsAt, r.isAdmin]);
    if (!loaded || k !== last) { S = r; last = k; render(); }
    loaded = true;
  } else if (!loaded) {
    $('#app').innerHTML = `<div class="gate"><h2>${MSG[r.error] || MSG.db}</h2><button class="btn pri" onclick="load()">Повторить</button></div>`;
  }
}

if (!tg.initData) {
  $('#app').innerHTML = '<div class="gate"><h2>Открой PartyFinder через Telegram</h2><p class="mut">Приложение работает только как Telegram Mini App.</p></div>';
} else {
  load();
  setInterval(() => { if (!document.hidden) load(); }, 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
}
</script>
</body>
</html>
