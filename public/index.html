body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70vmax 48vmax at 50% -8%, rgba(var(--g), 0.22), transparent 70%),
    radial-gradient(55vmax 40vmax at 100% 100%, rgba(60, 64, 74, 0.45), transparent 65%),
    radial-gradient(45vmax 35vmax at 0% 60%, rgba(60, 64, 74, 0.3), transparent 60%);
}

button, input { font-family: var(--m); }

/* ── Мульти-лобби: переключатель ── */
.lpick { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -2px; scrollbar-width: none; }
.lpick::-webkit-scrollbar { display: none; }

.lchip b { font: 700 12px/1.2 var(--m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Sci-fi HUD corners */
.hud { display: none !important;
  --c: rgba(223, 74, 66, 0.45);
  position: fixed; inset: 6px; z-index: 1; pointer-events: none;
  background:
    linear-gradient(var(--c), var(--c)) 0 0/16px 1.5px, linear-gradient(var(--c), var(--c)) 0 0/1.5px 16px,
    linear-gradient(var(--c), var(--c)) 100% 0/16px 1.5px, linear-gradient(var(--c), var(--c)) 100% 0/1.5px 16px,
    linear-gradient(var(--c), var(--c)) 0 100%/16px 1.5px, linear-gradient(var(--c), var(--c)) 0 100%/1.5px 16px,
    linear-gradient(var(--c), var(--c)) 100% 100%/16px 1.5px, linear-gradient(var(--c), var(--c)) 100% 100%/1.5px 16px;
  background-repeat: no-repeat;
}

#app {
  max-width: 580px; margin: 0 auto;
  padding: calc(var(--st) + 16px) 16px calc(var(--sb) + 104px);
  min-height: 100dvh; overflow-anchor: none;
}

#vb { transition: opacity .18s; }
#vb.busy { opacity: .45; pointer-events: none; }

#ld {
  position: fixed; left: 0; right: 0; top: 0; z-index: 8; height: 2.5px;
  background: linear-gradient(90deg, transparent, var(--crimson), #ff8595, transparent);
  background-size: 40% 100%; background-repeat: no-repeat; opacity: 0;
  transition: opacity .15s; animation: ld 1s linear infinite;
}
#ld.on { opacity: 1; }
@keyframes ld { from { background-position: -40% 0; } to { background-position: 140% 0; } }

/* Header & Typography */
.top, .rh, .th { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.m { font: 700 10px var(--m); letter-spacing: .08em; color: var(--mut); text-transform: uppercase; }
.sub, small { color: var(--mut); }
h1 {
  margin: 18px 0 6px;
  font: 900 clamp(23px, 7.5vw, 32px)/1.12 var(--d);
  text-transform: uppercase; letter-spacing: -.02em; color: #fff;
}
.rh h1 { margin-top: 14px; }
h2 { margin: 0 0 6px; font: 800 16px var(--d); color: #fff; }

mark {
  position: relative; display: inline-block; padding: 0 .22em;
  color: #fff; background: linear-gradient(135deg, var(--crimson), var(--burgundy));
  box-shadow: 0 0 28px rgba(var(--g), .55);
  border-radius: 6px; outline: 1px solid rgba(255, 255, 255, .35);
  transform-origin: left;
}

[data-fresh] mark { animation: draw .55s .05s cubic-bezier(.2, .8, .2, 1) both; }
[data-fresh] #vb { animation: rise .26s ease-out both; }
@keyframes draw { from { transform: scaleX(0); opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

/* User chip in top bar */
.chip {
  display: flex; align-items: center; gap: 8px; max-width: 65%; height: 34px;
  padding: 0 12px; border: 1px solid var(--ln-bright); border-radius: 99px;
  background: var(--card-glass); backdrop-filter: blur(14px);
  color: var(--ink); font: 700 11px var(--m); cursor: pointer;
  overflow: hidden; white-space: nowrap; transition: border-color .18s;
}
.chip:hover { border-color: var(--crimson); }
.chip img, .acc img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }

/* Frosted Boxes */
.box {
  position: relative; margin-top: 12px; padding: 16px;
  border: 1px solid var(--ln); border-radius: var(--r);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 45%), var(--card);
  box-shadow: 0 8px 30px -10px rgba(0, 0, 0, 0.7);
}
.box.hl {
  border-color: rgba(var(--g), 0.45);
  background: linear-gradient(160deg, rgba(var(--g), 0.16), rgba(128, 16, 28, 0.12) 55%), var(--card);
  box-shadow: inset 0 0 35px rgba(var(--g), 0.08), 0 10px 30px -12px rgba(var(--g), 0.25);
}

.big { margin-top: 4px; font: 900 42px/1 var(--d); color: #fff; }
.big small { font: 700 14px var(--m); color: var(--mut); }
.big.sm { font-size: 22px; }
.big2 { margin: 6px 0 2px; font: 900 26px/1.1 var(--d); }

.seg { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 12px; }
.seg i { height: 7px; border-radius: 3px; background: rgba(255, 255, 255, .08); }
.seg i.on { background: var(--crimson); box-shadow: 0 0 12px rgba(var(--g), .8); }

.bar { height: 5px; margin: 12px 0 6px; border-radius: 4px; background: rgba(255, 255, 255, .08); }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--burgundy), var(--crimson)); box-shadow: 0 0 12px rgba(var(--g), .8); transition: width .6s; }

/* Teams & Roles */
.teams { display: grid; gap: 8px; margin-top: 10px; }
@media(min-width: 680px) { .teams { grid-template-columns: 1fr 1fr; gap: 12px; } }
.th { padding-bottom: 8px; border-bottom: 1px solid var(--ln); font: 800 12px var(--d); }
.th span { font: 700 11px var(--m); color: var(--mut); }

.role, .row {
  width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px;
  align-items: center; padding: 9px 0; border: 0; border-bottom: 1px solid var(--ln);
  background: none; color: var(--ink); text-align: left; font: inherit;
}
.role { cursor: pointer; min-height: 58px; }
.role:last-child, .row:last-child { border-bottom: 0; }
.role i, .row i {
  display: grid; place-items: center; width: 40px; height: 40px;
  border: 1px solid var(--ln); border-radius: 10px;
  font: 800 10.5px var(--m); font-style: normal; color: #bbb;
  background: rgba(255, 255, 255, 0.02); overflow: hidden;
}
.role span b, .row span b { display: block; font: 700 13px var(--m); color: #fff; }
.role small, .row small { font-size: 11px; color: var(--mut); }
.role em, .row em { font: 800 11px var(--m); font-style: normal; color: var(--mut); }
.role.free em {
  padding: 6px 12px; border-radius: 8px;
  background: rgba(var(--g), .18); color: #ff5266; font-weight: 800;
  border: 1px solid rgba(var(--g), 0.3);
}
.role.taken { opacity: .75; cursor: pointer; }
.role.mine { opacity: 1; }
.role.mine i { background: linear-gradient(135deg, var(--crimson), var(--burgundy)); border-color: var(--crimson); color: #fff; box-shadow: 0 0 16px rgba(var(--g), .6); }
.role.mine em { color: #ff5266; }
.row.top i { color: #ff5266; border-color: rgba(var(--g), .6); }
.row.top em { color: #fff; }

/* MVP Leader Medal Badge */
.badge-mvp-leader {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 7px 1px 5px;
  border-radius: 99px;
  background: linear-gradient(135deg, rgba(255, 194, 89, 0.28), rgba(128, 16, 28, 0.45));
  border: 1px solid rgba(255, 194, 89, 0.7);
  color: #ffc259;
  font: 800 9.5px var(--m);
  letter-spacing: .03em;
  text-transform: uppercase;
  box-shadow: 0 0 14px rgba(255, 194, 89, 0.35);
  vertical-align: middle;
  margin-left: 4px;
}
.role.is-top-mvp {
  border-color: rgba(255, 194, 89, 0.42);
  background: linear-gradient(90deg, rgba(255, 194, 89, 0.1), transparent 55%);
}
.role.is-top-mvp:hover {
  border-color: rgba(255, 194, 89, 0.7);
}
.role.is-top-mvp i {
  border-color: rgba(255, 194, 89, 0.6);
  box-shadow: 0 0 14px -2px rgba(255, 194, 89, 0.45);
  position: relative;
}
.slot-medal {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ffd369, #b45309);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 10px;
  line-height: 1;
  box-shadow: 0 0 8px rgba(255, 194, 89, 0.9);
  border: 1px solid #fff;
  animation: pulse-gold 2s infinite ease-in-out;
  z-index: 2;
}
@keyframes pulse-gold {
  0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(255, 194, 89, 0.9); }
  50% { transform: scale(1.12); box-shadow: 0 0 14px rgba(255, 194, 89, 1); }
}

.pz { margin: 8px 0 0; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 48px; margin-top: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
  background: linear-gradient(180deg, #ff4158, #cf1b30);
  box-shadow: 0 8px 24px -6px rgba(var(--g), .6), inset 0 1px 0 rgba(255, 255, 255, .25);
  color: #fff; font: 800 11px var(--d); text-transform: uppercase; letter-spacing: .05em;
  cursor: pointer; transition: transform .12s, filter .18s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.98); }
.btn.g {
  background: rgba(255, 255, 255, .04); border-color: var(--ln-bright);
  box-shadow: none; color: #f0eef0;
}
.btn.g:hover { background: rgba(255, 255, 255, .07); border-color: rgba(var(--g), .5); }
.btn.x { display: inline-flex; width: auto; height: 34px; margin: 0; padding: 0 14px; font-size: 10.5px; border-radius: 8px; }
.btn.copy-btn {
  background: linear-gradient(135deg, rgba(223, 74, 66, 0.22), rgba(128, 16, 28, 0.35));
  border: 1px solid rgba(var(--g), 0.5); color: #fff;
}
.btn.copy-btn:hover { background: linear-gradient(135deg, rgba(223, 74, 66, 0.35), rgba(128, 16, 28, 0.5)); }

/* Floating Bottom Navigation Bar */
.nav {
  position: fixed; left: 50%; bottom: calc(var(--sb) + 14px); z-index: 10;
  display: flex; gap: 4px; padding: 4px 6px; transform: translateX(-50%);
  border: 1px solid var(--ln-bright); border-radius: 99px;
  background: rgba(14, 5, 9, 0.88); backdrop-filter: blur(18px);
  box-shadow: 0 14px 40px -10px rgba(0, 0, 0, 0.85), 0 0 30px -10px rgba(var(--g), 0.25);
  max-width: 95vw; overflow-x: auto; scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav button {
  display: flex; align-items: center; gap: 5px; height: 38px; padding: 0 12px;
  transition: background .18s, color .18s, transform .12s;
  border: 0; border-radius: 99px; background: none; color: var(--mut);
  font: 800 10.5px var(--m); text-transform: uppercase; letter-spacing: .04em;
  cursor: pointer; white-space: nowrap;
}
.nav button svg { width: 15px; height: 15px; stroke-width: 2.2; }
.nav button.on {
  background: linear-gradient(135deg, var(--crimson), var(--burgundy));
  color: #fff; box-shadow: 0 4px 16px rgba(var(--g), .5);
}

/* Modal Sheets */
.ov {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, .85); backdrop-filter: blur(10px); animation: fade .18s;
}
.sheet {
  width: 100%; max-width: 540px; max-height: 88vh; overflow-y: auto;
  padding: 22px 18px calc(var(--sb) + 24px);
  border-top: 2px solid var(--crimson); border-radius: 24px 24px 0 0;
  background: linear-gradient(180deg, #180910, #0c0407);
  box-shadow: 0 -24px 70px -20px rgba(var(--g), .4);
  animation: up .28s cubic-bezier(.2, .8, .2, 1);
}
.sheet::before {
  content: ""; display: block; width: 42px; height: 4px; margin: -10px auto 16px;
  border-radius: 4px; background: rgba(255, 255, 255, .22);
}
@keyframes up { from { transform: translateY(28px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

.fld {
  display: block; margin-top: 10px; padding: 10px 14px;
  border: 1px solid var(--ln); border-radius: 12px; background: #0c0408;
  transition: border-color .18s, box-shadow .18s;
}
.fld:focus-within {
  border-color: var(--crimson);
  box-shadow: 0 0 0 3px rgba(var(--g), .18);
}
.fld span { font: 700 9px var(--m); letter-spacing: .08em; color: var(--mut); text-transform: uppercase; }
.fld input {
  display: block; width: 100%; margin-top: 5px; border: 0;
  background: none; outline: 0; color: #fff; font: 600 15px var(--m);
  caret-color: var(--crimson);
}

.acc { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.acc img { width: 46px; height: 46px; }
.acc b { display: block; color: #fff; }

.toast {
  position: fixed; left: 50%; top: calc(var(--st) + 16px); z-index: 50;
  transform: translateX(-50%); max-width: 90%; padding: 11px 18px;
  border: 1px solid var(--crimson); border-radius: 10px;
  background: #1a070f; color: #fff; font: 700 12px var(--m);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .8), 0 0 20px rgba(var(--g), .35);
  animation: pop .24s ease-out;
}

.chips {
  display: flex; gap: 6px; margin-top: 10px; overflow-x: auto;
  scrollbar-width: none; margin-right: -16px; padding-right: 16px;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; height: 32px; padding: 0 13px;
  border: 1px solid var(--ln); border-radius: 99px;
  background: rgba(255, 255, 255, 0.03); color: var(--mut);
  font: 700 11px var(--m); cursor: pointer; transition: all .16s;
}
.chips button.on {
  border-color: var(--crimson);
  background: linear-gradient(135deg, rgba(var(--g), 0.28), rgba(128, 16, 28, 0.35));
  color: #fff; box-shadow: 0 0 12px rgba(var(--g), .25);
}

.grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  margin-top: 12px; border: 1px solid var(--ln); border-radius: 12px;
  background: var(--ln); overflow: hidden;
}
.grid div { padding: 10px 12px; background: var(--card); }
.grid b { display: block; margin-top: 2px; font: 800 14px var(--d); color: #fff; }

.stabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px;
  padding: 4px; border: 1px solid var(--ln); border-radius: 12px; background: var(--bg-deep);
}
.stab {
  height: 38px; border: 0; border-radius: 8px; background: none;
  color: var(--mut); font: 800 11px var(--m); text-transform: uppercase;
  cursor: pointer; transition: all .16s;
}
.stab.on {
  background: linear-gradient(135deg, var(--crimson), var(--burgundy));
  color: #fff; box-shadow: 0 4px 14px rgba(var(--g), .45);
}

.er { min-height: 18px; margin-top: 6px; color: #ff6b7e; font-size: 12px; }
.skl {
  height: 58px; margin-top: 10px; border-radius: 12px;
  background: linear-gradient(90deg, rgba(255, 255, 255, .03), rgba(223, 74, 66, .08), rgba(255, 255, 255, .03)) 0 0/200% 100%;
  animation: sk 1.2s linear infinite;
}
@keyframes sk { to { background-position: -200% 0; } }

/* Avatar with power level ring */
.av {
  flex: none; display: inline-grid; place-items: center; border-radius: 50%;
  background: conic-gradient(from 200deg, var(--fc), rgba(255, 255, 255, .2), var(--fc));
  box-shadow: 0 0 16px -2px var(--fc);
}
.av img, .av .ph {
  width: 100%; height: 100%; border-radius: 50%;
  object-fit: cover; border: var(--bw, 2px) solid var(--bg); background: #1a0810;
}

/* ── FAVORITE HERO SHOWCASE CARD (SCREENSHOT STYLE) ── */
.fav-hero-banner {
  position: relative; margin-top: 14px; border-radius: 20px;
  border: 1px solid rgba(var(--g), 0.45);
  background: linear-gradient(135deg, rgba(128, 16, 28, 0.45), rgba(26, 8, 15, 0.95) 70%), #12050b;
  box-shadow: 0 14px 40px -10px rgba(0, 0, 0, 0.8), 0 0 35px -8px rgba(var(--g), 0.35);
  overflow: hidden; cursor: pointer; transition: transform .14s, border-color .2s;
}
.fav-hero-banner:active { transform: scale(.985); }
.fav-hero-bg {
  position: absolute; right: -15px; top: -15px; bottom: -15px; width: 55%;
  opacity: .38; pointer-events: none; mask-image: linear-gradient(to right, transparent 0%, black 60%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 60%);
}
.fav-hero-bg img { width: 100%; height: 100%; object-fit: cover; filter: drop-shadow(0 0 20px rgba(var(--g), 0.5)); }
.fav-hero-body { position: relative; z-index: 2; padding: 18px 18px 16px; }
.fav-hero-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 99px; font: 800 9.5px var(--m);
  text-transform: uppercase; letter-spacing: .08em;
  background: rgba(var(--g), 0.22); color: #ff687a; border: 1px solid rgba(var(--g), 0.4);
}
.fav-hero-title {
  margin: 10px 0 2px; font: 900 24px/1.1 var(--d); color: #fff;
  text-transform: uppercase; letter-spacing: -.02em;
}
.fav-hero-sub { font: 600 12px var(--m); color: #d0c0c8; }
.fav-hero-meta {
  display: flex; gap: 12px; align-items: center; margin-top: 14px;
}
.fav-hero-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px;
  border-radius: 99px; background: linear-gradient(135deg, var(--crimson), var(--burgundy));
  color: #fff; font: 800 10.5px var(--m); text-transform: uppercase;
  border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: 0 4px 14px rgba(var(--g), 0.5);
}

/* Empty Favorite Hero Banner */
.fav-hero-empty {
  margin-top: 14px; padding: 20px 18px; border-radius: 20px;
  border: 1px dashed rgba(var(--g), 0.45);
  background: linear-gradient(135deg, rgba(var(--g), 0.08), rgba(12, 4, 8, 0.8)), var(--card);
  text-align: center; cursor: pointer; transition: transform .14s, border-color .18s;
}
.fav-hero-empty:hover { border-color: var(--crimson); }
.fav-hero-empty .icon {
  font-size: 36px; line-height: 1; display: inline-block;
  filter: drop-shadow(0 0 14px rgba(var(--g), 0.6));
}

/* ── HERO CATALOG (2-COLUMN GRID MATCHING SCREENSHOT) ── */
.catalog-search-wrap {
  position: relative; margin-top: 14px;
}
.catalog-search-wrap svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; stroke: var(--crimson); fill: none; stroke-width: 2.2;
}
.catalog-search {
  width: 100%; height: 48px; padding: 0 14px 0 44px;
  border: 1px solid var(--ln-bright); border-radius: 14px;
  background: rgba(20, 8, 14, 0.9); color: #fff; font: 600 14px var(--m);
  outline: 0; caret-color: var(--crimson); transition: border-color .18s, box-shadow .18s;
}
.catalog-search:focus {
  border-color: var(--crimson);
  box-shadow: 0 0 0 3px rgba(var(--g), 0.2);
}

/* ── HERO CARDS: premium red/black (OLYMP CUSTOM palette) ── */
:root {
  --o-k: #070707; --o-bg: #5B0F22; --o-c: #C1122F; --o-r: #FF2A45; --o-w: #F2F2F2;
}

/* Арт героя: невидим, пока не загрузится (нет скачков), затем плавно проявляется */
.hart { opacity: 0; transition: opacity .35s ease-out; }
.hart.in { opacity: 1; }
.hart.fb { object-fit: cover; }
@media (prefers-reduced-motion: reduce) { .hart { transition: none; } }

.hero-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; margin-top: 14px;
}
.hero-card {
  position: relative; aspect-ratio: 3 / 4; border-radius: 20px;
  cursor: pointer; text-align: left; -webkit-user-select: none; user-select: none;
  transition: transform .14s;
}
.hero-card:active { transform: scale(.97); }

/* Панель-фон: глубокий тёмный с бордовым свечением */
.hc-bg {
  position: absolute; inset: 0; border-radius: 20px;
  border: 1px solid rgba(255, 42, 69, .22);
  background: radial-gradient(120% 75% at 50% 28%, rgba(193, 18, 47, .42), rgba(91, 15, 34, .4) 48%, var(--o-k) 88%);
  box-shadow: 0 12px 24px -14px rgba(0, 0, 0, .95);
  transition: border-color .18s, box-shadow .18s;
}
.hero-card:hover .hc-bg { border-color: rgba(255, 42, 69, .55); }
.hero-card.is-favorite .hc-bg {
  border-color: var(--o-r);
  box-shadow: 0 0 0 1px rgba(255, 42, 69, .5), 0 10px 26px -8px rgba(255, 42, 69, .5);
}

/* Слой арта: по умолчанию обрезается по скруглению карточки */
.hc-art { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; }
/* Режим «выход за границу» (для PNG с прозрачным фоном): голова выходит выше карточки,
   по бокам и снизу арт обрезается по границе */
.hero-card.out .hc-art { overflow: visible; clip-path: inset(-30% 0 0 0 round 0 0 20px 20px); }

.hc-img {
  position: absolute; left: 50%; bottom: 0; width: 100%; height: auto; aspect-ratio: 1 / 1;
  object-fit: cover; transform-origin: 50% 100%;
  transform: translate(calc(-50% + var(--ax, 0%)), var(--ay, 0%)) scale(var(--as, 1.36));
}
.hero-card.out .hc-img {
  object-fit: contain;
  transform: translate(calc(-50% + var(--ax, 0%)), var(--ay, 0%)) scale(var(--as, 1.5));
}
/* Заглушка с инициалами: держит место и пропадает, когда картинка загружена */
.hc-ph {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 900 34px var(--d); color: rgba(255, 42, 69, .28); transition: opacity .3s; pointer-events: none;
}
.hart.in ~ .hc-ph { opacity: 0; }

/* Низ изображения растворяется в тёмном градиенте, имя читается на любом арте */
.hc-shade {
  position: absolute; left: 0; right: 0; bottom: 0; height: 56%; border-radius: 0 0 20px 20px; pointer-events: none;
  background: linear-gradient(to top, var(--o-k) 4%, rgba(7, 7, 7, .86) 34%, rgba(7, 7, 7, 0));
}
.hc-info { position: absolute; left: 12px; right: 12px; bottom: 11px; }
.hero-card-name {
  font: 800 14px/1.15 var(--d); color: var(--o-w);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 8px rgba(0, 0, 0, .8);
}
.hero-card-sub {
  margin-top: 3px; font: 600 10.5px var(--m); color: #c9aab3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Индикатор выбора */
.hc-sel {
  position: absolute; top: 9px; right: 9px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; font: 800 12px/1 var(--m); color: #fff;
  border: 1.5px solid rgba(242, 242, 242, .35); background: rgba(7, 7, 7, .45);
}
.hero-card.is-favorite .hc-sel {
  background: var(--o-r); border-color: var(--o-r); box-shadow: 0 0 10px rgba(255, 42, 69, .7);
}


/* ── HQ-каталог: арт 16:9, подпись под картинкой ── */
.hero-grid.hq { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
.hero-card.hq { aspect-ratio: auto; border-radius: 16px; background: #0c0407; border: 1px solid rgba(255, 42, 69, .22); overflow: hidden; }
.hero-card.hq.is-favorite { border-color: var(--o-r); box-shadow: 0 0 0 1px rgba(255, 42, 69, .5); }
.hq-pic { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: radial-gradient(90% 80% at 50% 38%, rgba(193, 18, 47, .5), #0c0407 92%); }
.hq-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hq-cap { padding: 8px 10px 10px; }
.hq-cap small { display: block; font: 700 9px var(--m); letter-spacing: .06em; color: #c9aab3; }
.hq-cap .hero-card-name { font-size: 16px; margin-top: 2px; }
.hero-detail-art.hq { height: auto; aspect-ratio: 16 / 9; }
.hero-detail-art.hq .hd-img { object-fit: contain; object-position: 50% 50%; }
.hero-filters { display: flex; gap: 6px; margin-top: 8px; }
.hero-filters select, .hero-filters button { flex: 1; min-width: 0; height: 38px; padding: 0 10px; border-radius: 10px; background: #160910; color: var(--o-w); border: 1px solid rgba(255, 42, 69, .25); font: 600 12px var(--m); }
.hero-filters button.on { background: var(--o-r); border-color: var(--o-r); }
.hero-count { margin-top: 12px; font: 600 11px var(--m); color: #c9aab3; }
@media (min-width: 700px) { .hero-grid.hq { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1600px) { .hero-grid.hq { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* ── HERO DETAIL: большая карточка (арт сверху, плавный переход в фон) ── */
.hero-detail-art {
  position: relative; height: 300px; overflow: hidden;
  background: radial-gradient(90% 80% at 50% 38%, rgba(193, 18, 47, .5), rgba(91, 15, 34, .45) 52%, #0c0407 92%);
}
.hero-detail-art .hd-img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%;
  transform-origin: 50% 25%;
  transform: translate(var(--ax, 0%), var(--ay, 0%)) scale(var(--as, 1));
}
.hero-detail-art.out .hd-img { object-fit: contain; object-position: 50% 100%; }
.hero-detail-art::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 58%; pointer-events: none;
  background: linear-gradient(to top, #160910 6%, rgba(22, 9, 16, .75) 40%, rgba(22, 9, 16, 0));
}
.hero-detail-art .hc-ph { font-size: 80px; }
.hero-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hero-pill {
  padding: 4px 12px; border-radius: 99px; font: 800 10px var(--m);
  text-transform: uppercase; letter-spacing: .06em;
  background: rgba(255, 255, 255, 0.05); color: #e4d7dc; border: 1px solid var(--ln);
}
.hero-pill.hl {
  background: rgba(var(--g), 0.2); color: #ff687a; border-color: rgba(var(--g), 0.4);
}

.hero-detail-head { position: relative; margin: -6px -18px 0; }
.hero-detail-name {

async function api(path, method = 'GET', body, ms = 12000) {
  for (let i = 0; ; i++) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
    try {
      const r = await fetch('/api/' + path, {
        method, body: body && JSON.stringify(body), signal: ac.signal,
        headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg.initData || '', 'X-Lobby': String(LID) }
      });
      const j = await r.json().catch(() => ({}));
      const error = j.error ? ERR[j.error] || j.error : r.ok ? undefined : r.status >= 500 ? 'Сервер временно недоступен' : 'Ошибка ' + r.status;
      return { ...j, ok: r.ok, status: r.status, error };
    } catch (e) {
      if (e.name === 'AbortError') return { ok: false, error: 'Сервер долго отвечает' };
      if (method === 'GET' && i === 0) { await new Promise(r => setTimeout(r, 700)); continue; }
      return { ok: false, error: 'Нет связи с сервером' };
    } finally { clearTimeout(t); }
  }
}

function formatMatchSummary(m) {
  if (!m) return '';
  const dateStr = new Date(m.at || Date.now()).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  const t1 = (m.players || []).filter(p => p.team === 1);
  const t2 = (m.players || []).filter(p => p.team === 2);
  const mvp = (m.players || []).find(p => p.uid === m.mvp);
  const winnerTitle = m.winner ? `Команда ${m.winner}` : 'Ничья / Завершён';

  let txt = `🏆 *OLYMP CUSTOM — МАТЧ №${m.id || ''}*\n`;
  txt += `📅 ${dateStr}${m.season ? ` · Сезон ${m.season}` : ''}\n`;
  txt += `👑 *Победитель:* ${winnerTitle}\n`;
  if (mvp) txt += `⭐ *MVP:* ${mvp.name} (+${S.mvpRp} RP)\n`;
  txt += `\n🔴 *КОМАНДА 1${m.winner === 1 ? ' (Победа)' : ''}:*\n`;
  t1.forEach(p => {
    const isMvp = p.uid === m.mvp;
    txt += `• ${p.name} [${roleName(p.role)}]${isMvp ? ' ⭐ MVP' : ''}\n`;
  });
  txt += `\n🔵 *КОМАНДА 2${m.winner === 2 ? ' (Победа)' : ''}:*\n`;
  t2.forEach(p => {
    const isMvp = p.uid === m.mvp;
    txt += `• ${p.name} [${roleName(p.role)}]${isMvp ? ' ⭐ MVP' : ''}\n`;
  });
  txt += `\n⚔️ *OLYMP CUSTOM* — @olymp_custom_bot`;
  return txt;
}

async function copyMatchSummary(m) {
  const summary = formatMatchSummary(m);
  if (!summary) return;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(summary);
    } else {
      const ta = document.createElement('textarea');
      ta.value = summary;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('📋 Сводка матча скопирована для Telegram!');
    try { tg.HapticFeedback?.notificationOccurred('success'); } catch {}
  } catch (e) {
    toast('Не удалось скопировать. Попробуй ещё раз');
  }
}

// ── АРТ ГЕРОЕВ: обрезка, плавное появление, запасное изображение ──
// Индивидуальная обрезка по английскому имени героя. Поля:
//   карточка каталога: s — масштаб, x / y — сдвиг в % (y < 0 поднимает арт вверх);
//   большая карточка:  ds — масштаб, dx / dy — сдвиг в %;
//   out: true — арт выходит за верхнюю границу карточки (только для PNG с прозрачным фоном).
// Пример: 'Aulus': { s: 1.5, y: -6, out: true }
const HERO_ART_DEFAULT = { out: false }; // true — включить выход за границу для всех героев
const HERO_ART = {};
const HART_SEEN = new Set(); // адреса, уже загруженные в этой сессии: повторно не анимируем
const heroArtCfg = h => ({ ...HERO_ART_DEFAULT, ...(HERO_ART[h.en] || {}) });
const heroFallback = () => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
  '<stop offset="0" stop-color="#5B0F22"/><stop offset="1" stop-color="#070707"/></linearGradient></defs>' +
  '<rect width="120" height="120" fill="url(#g)"/><circle cx="60" cy="46" r="20" fill="#C1122F" opacity=".55"/>' +
  '<path d="M18 120C18 82 102 82 102 120Z" fill="#C1122F" opacity=".55"/></svg>');
// mode: 'card' | 'detail' | 'fav'. Возвращает <img> без искажения пропорций (object-fit), с lazy-загрузкой.
function heroImg(h, cls, mode = 'card') {
  const a = heroArtCfg(h), st = [];
  const sc = mode === 'detail' ? a.ds : a.s, dx = mode === 'detail' ? a.dx : a.x, dy = mode === 'detail' ? a.dy : a.y;
  if (mode !== 'fav') {
    if (sc != null) st.push(`--as:${+sc}`);
    if (dx != null) st.push(`--ax:${+dx}%`);
    if (dy != null) st.push(`--ay:${+dy}%`);
  }
  const src = mode === 'detail' ? (h.art || h.img) : h.img;
  return `<img class="hart ${cls}${HART_SEEN.has(src) ? ' in' : ''}" src="${esc(src)}" alt="${mode === 'fav' ? '' : esc(h.name)}" data-u="${esc(src)}"` +
    `${st.length ? ` style="${st.join(';')}"` : ''}${mode === 'detail' ? '' : ' loading="lazy"'} decoding="async" referrerpolicy="no-referrer">`;
}
// load/error не всплывают, поэтому слушаем в фазе перехвата: один раз на весь документ
document.addEventListener('load', e => {
  const i = e.target;
  if (i.tagName === 'IMG' && i.classList.contains('hart')) { i.classList.add('in'); if (i.dataset.u && !i.dataset.fb) HART_SEEN.add(i.dataset.u); }
}, true);
document.addEventListener('error', e => {
  const i = e.target;
  if (i.tagName === 'IMG' && i.classList.contains('hart') && !i.dataset.fb) { i.dataset.fb = '1'; i.classList.add('fb'); i.src = heroFallback(); }
}, true);

    <div class="skills-sec-title">Навыки героя</div>
    <div class="skills-grid">${skillsHtml}</div>

      <div style="margin-top:4px;color:var(--mut)">${esc(hero.skills?.[0]?.desc || '')}</div>

    <div class="skills-sec-title">Характеристики в бою</div>

      ${statBar('Сила в поздней игре (Late Power)', hero.stats?.latePower || 8)}
      ${statBar('Сложность освоения (Difficulty)', hero.stats?.difficulty || 6)}
      ${statBar('Живучесть и контроль (Durability)', hero.stats?.durability || 7)}
      ${statBar('Атакующий потенциал (Offense)', hero.stats?.offense || 8)}
    </div>

    <button class="btn" id="setFavoriteBtn" style="margin-top:20px">
      ${isFav ? '✓ Выбран твоим любимым героем' : '⭐ Выбрать любимым героем'}

    <div style="display:flex;gap:8px;margin-top:8px">

const aiList = s => String(s || '').split(/[,;\n]/).map(x => x.trim()).filter(Boolean);

function aiText(text) {
  const f = document.createDocumentFragment();
  for (const line of String(text).split('\n')) {
    const d = document.createElement('div'); let t = line.trim();
    if (!t) { d.className = 'sp'; f.append(d); continue; }
    const li = /^([-—•*])\s+/.exec(t);
    if (li) { d.className = 'li'; t = t.slice(li[0].length); }
    t.split(/\*\*(.+?)\*\*/).forEach((part, i) => { if (!part) return; if (i % 2) { const b = document.createElement('b'); b.textContent = part; d.append(b); } else d.append(part); });
    f.append(d);
  }
  return f;
}
const aiEl = (cls, tag = 'div') => { const e = document.createElement(tag); e.className = cls; return e; };
const aiTyping = () => { const m = aiEl('msg a'), t = aiEl('typ', 'span'); t.innerHTML = '<i></i><i></i><i></i>'; m.append(t); return m; };
function aiErrEl(error) {
  const m = aiEl('msg e'); m.append(String(error || 'AI не ответил. Попробуй ещё раз'));
  const b = aiEl('btn g x', 'button'); b.dataset.retry = '1'; b.textContent = 'Повторить'; m.append(document.createElement('br'), b); return m;
}
function aiAnswerEl(out, mode) {
  const w = aiEl('aia'), t = aiEl('ai-t'); t.append(aiText(out.answer)); w.append(t);
  const n = aiEl('ai-n'), parts = [];
  if (mode === 'draft') parts.push('Рекомендации сгенерированы Gemini 2.5 Pro на основе текущей меты.');
  else if (mode === 'coach') parts.push(out.data?.games ? `Разбор по ${out.data.games} кастомкам в OLYMP CUSTOM.` : 'Нужна хотя бы одна сыгранная кастомка.');
  n.textContent = parts.join(' '); if (parts.length) w.append(n);
  return w;
}

    main: `<h2>Привязка аккаунта MLBB</h2><p class="sub">Укажи ID и Zone ID. Ник и строку «О себе» можно менять в любой момент.</p>${fld('Игровой ID', 'mlId', '12345678', P?.mlbbId)}${fld('Zone ID', 'mlZone', '1234', P?.mlbbZone)}
      <label class="fld"><span>Ник</span><input id="mlNick" value="${esc(P?.nick)}" placeholder="Твой ник" maxlength="24" autocomplete="off"></label>
      <label class="fld"><span>О себе</span><input id="mlBio" value="${esc(P?.bio)}" placeholder="Например: main Fanny" maxlength="60" autocomplete="off"></label>
      <button class="btn" id="save">Сохранить</button>
      ${P?.mlbbId ? `<button class="btn g" id="verify">${P.verified ? 'Обновить данные из игры' : 'Подтвердить через игру'}</button>` : ''}`,
    code: `<h2>Код из игровой почты</h2><p class="sub">Открой почту в MLBB. Код действует 5 минут.</p>${fld('Код', 'mlCode', '000000')}<button class="btn" id="ver">Подтвердить</button>`
  }[step];
  const sh = sheet(html), close = () => sh.parentNode.remove(), on = (id, fn) => { const b = sh.querySelector(id); if (b) b.onclick = () => fn(b); };
  on('#save', b => lock(b, 'Сохраняю…', async () => {
    const r = await api('profile', 'POST', { mlbbId: $('#mlId').value.trim(), mlbbZone: $('#mlZone').value.trim(), nick: $('#mlNick').value.trim(), bio: $('#mlBio').value });
    if (r.ok) { P = r.profile; close(); render(); toast('Профиль сохранён'); } else toast(r.error || 'Ошибка');
  }));
  on('#verify', b => startVerify($('#mlId').value.trim(), $('#mlZone').value.trim(), b, close));
  on('#ver', b => lock(b, 'Проверяю…', async () => {
    const r = await api('mlbb/verify', 'POST', { mlbbId: acc.id, mlbbZone: acc.zone, code: $('#mlCode').value.trim() }, 45000);
    if (r.ok) { P = r.profile; close(); loadLobby().then(render); render(); toast('Аккаунт подтверждён'); } else toast(r.error || 'Ошибка');
  }));
}

function findSheet() {
  const sh = sheet(`<h2>Найти игрока</h2><p class="sub">Поиск по нику, от двух букв.</p>${fld('Ник', 'fq', 'Например Olymp', '')}<div id="fr"></div><button class="btn g" data-a="close">Закрыть</button>`);
  const inp = sh.querySelector('#fq'), out = sh.querySelector('#fr'); let t;
  inp.oninput = () => {
    clearTimeout(t); const q = inp.value.trim();
    if (q.length < 2) { out.innerHTML = ''; return; }
    t = setTimeout(async () => {
      const r = await api('players?q=' + encodeURIComponent(q));
      if (inp.value.trim() !== q) return;
      out.innerHTML = r.ok ? (r.players.length ? r.players.map(p => `<button class="row" data-a="pview" data-u="${esc(p.uid)}"><i>${av(p.avatar, p.power, 36)}</i><span><b>${esc(p.name)}${p.verified ? ' ✓' : ''}</b></span><em></em></button>`).join('') : '<p class="empty">Никого не нашли</p>') : `<p class="er">${esc(r.error)}</p>`;
    }, 300);
  };
}

async function cardSheet() {
  if (!P?.mlbbId) { toast('Сначала привяжи аккаунт'); return profileSheet(); }
  const sh = sheet('<h2>Карточка игрока</h2><div class="skl" style="height:300px"></div>');
  const cv = await drawCard(P);
  if (!sh.isConnected) return;
  const story = typeof tg.shareToStory === 'function';
  sh.innerHTML = `<h2>Карточка игрока</h2><img class="cardimg" src="${cv.toDataURL('image/png')}" alt="" style="width:100%;border-radius:14px;margin-top:12px;border:1px solid var(--ln)">
    <button class="btn" id="cs">Отправить в чат с ботом</button>${story ? '<button class="btn g" id="cst">В историю Telegram</button>' : ''}<button class="btn g" data-a="close">Закрыть</button>`;
  const up = async send => {
    const blob = await new Promise(r => cv.toBlob(r, 'image/png')), ac = new AbortController(), t = setTimeout(() => ac.abort(), 30000);
    try { const r = await fetch('/api/card' + (send ? '' : '?send=0'), { method: 'POST', body: blob, signal: ac.signal, headers: { 'Content-Type': 'image/png', 'X-Init-Data': tg.initData } }); return { ok: r.ok, ...await r.json().catch(() => ({})) }; }
    catch { return { ok: false, error: 'Нет связи с сервером' }; } finally { clearTimeout(t); }
  };
  const on = (id, fn) => { const b = sh.querySelector(id); if (b) b.onclick = () => lock(b, 'Готовлю…', fn); };
  on('#cs', async () => { const r = await up(true); if (r.ok) { toast('Карточка в чате с ботом'); buzz('success'); } else toast(r.error || 'Ошибка'); });
  on('#cst', async () => { const r = await up(false); if (!r.ok) return toast(r.error || 'Ошибка'); try { tg.shareToStory(r.url, { text: 'Моя карточка в OLYMP CUSTOM' }); } catch { toast('История недоступна'); } });
}

function repSheet() {
  const m = RP; if (!m) return;
  const sh = sheet(''), draw = () => {
    sh.innerHTML = `<h2>Оцени игроков</h2><p class="sub">Плюс за адекватность, минус за токсичность или АФК.</p>` +
      m.players.map(p => `<div class="ar"><span><b>${esc(p.name)}</b><small>Команда ${p.team}, ${esc(roleName(p.role))}</small></span><span class="ac"><button class="btn x${p.val === 1 ? '' : ' g'}" data-v="1" data-u="${esc(p.uid)}">+1</button><button class="btn x${p.val === -1 ? '' : ' g'}" data-v="-1" data-u="${esc(p.uid)}">−1</button></span></div>`).join('') +
      '<button class="btn" data-a="close">Готово</button>';
  };
  draw();
  sh.onclick = async e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const p = m.players.find(x => x.uid === b.dataset.u), v = +b.dataset.v, val = p.val === v ? 0 : v;
    const r = await api('rep', 'POST', { matchId: m.id, uid: p.uid, val });
    if (r.ok) { p.val = val || null; draw(); render(); } else toast(r.error || 'Ошибка');
  };
}

function finishSheet() {

  const sh = sheet(''), draw = () => {
    const sc = sh.scrollTop;
    sh.innerHTML = `<h2>Итоги матча</h2><p class="sub">Победитель и MVP попадут в историю игроков. MVP получает +${S.mvpRp} RP.</p>
      <span class="m l">Кто победил</span><div class="stabs" style="grid-template-columns:repeat(3,1fr)">${[[1, 'Команда 1'], [2, 'Команда 2'], [0, 'Не указан']].map(([v, n]) => `<button class="stab${(win || 0) === v ? ' on' : ''}" data-w="${v}">${n}</button>`).join('')}</div>
      <span class="m l" style="margin-top:14px;display:block">Кто MVP</span>${S.players.map(p => `<button class="role free" data-u="${esc(p.uid)}"><i>${p.team}</i><span><b>${esc(p.name)}</b><small>${esc(roleName(p.role))}</small></span><em>MVP</em></button>`).join('')}
      <button class="btn g" data-u="">Без MVP, только сохранить итог</button>`;
    sh.scrollTop = sc;
  };
  draw();
  sh.onclick = async e => {
    const w = e.target.closest('[data-w]'); if (w) { win = +w.dataset.w || null; return draw(); }

    if (r.ok) { S = r; sh.parentNode.remove(); render(); toast('Матч сохранён'); loadProfile().then(render); if (r.matchId) matchSheet(r.matchId, true); } else toast(r.error || 'Ошибка');
  };

// ── Effects & Animation helpers ──
const buzz = t => { try { tg.HapticFeedback?.notificationOccurred(t); } catch {} };
const calm = () => matchMedia('(prefers-reduced-motion:reduce)').matches;
function confetti(n = 100) {
  if (calm()) return;
  const c = document.createElement('canvas'); c.className = 'cf'; c.width = innerWidth; c.height = innerHeight; document.body.append(c);
  const x = c.getContext('2d'), cols = ['#df4a42', '#ffc259', '#ffffff', '#3a2a2d', '#34d399'];
  const ps = Array.from({ length: n }, () => ({
    x: c.width / 2 + (Math.random() - 0.5) * 140, y: c.height * 0.38,
    vx: (Math.random() - 0.5) * 15, vy: -Math.random() * 15 - 4,
    w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
    c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, c.width, c.height);
    for (const p of ps) {
      p.vy += 0.45; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      x.globalAlpha = Math.max(0, 1 - (t - t0) / 2800); x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
    }
    if (t - t0 < 2800) requestAnimationFrame(f); else c.remove();
  })(t0);
}

function runCounts(root) {
  (root || document).querySelectorAll('[data-cu]:not([data-cd])').forEach(el => {
    el.dataset.cd = 1; const to = +el.dataset.cu; if (calm() || !to) return;
    const t0 = performance.now(); el.textContent = '0';
    (function f(t) { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
  });
}

// ── ДОСТИЖЕНИЯ И ТИТУЛЫ ──
const ttlTag = (t, solo) => t ? `<span class="ttl${solo ? ' solo' : ''}">${esc(t)}</span>` : '';
const dFmt = d => new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });

// Карточка в профиле: счётчик, полоска, самые редкие награды
function achvBox(p) {
  const a = p.achv; if (!a) return '';
  const pct = a.total ? Math.round(a.earned / a.total * 100) : 0;
  return `<div class="box"><div class="th"><b>Достижения</b><span>${a.earned}/${a.total}</span></div>
    <div class="av-bar"><i style="width:${pct}%"></i></div>
    ${a.list.length ? `<div class="av-ic">${a.list.slice(0, 8).map(x => `<span style="--ac:${x.color}" title="${esc(x.name)}">${x.icon}</span>`).join('')}</div>` : '<p class="sub" style="margin:10px 0 0">Пока пусто. Сыграй матч в кастомке, и первая награда не заставит себя ждать.</p>'}
    <button class="btn g" style="margin-top:12px" data-a="achv" data-u="${esc(p.uid)}">Все достижения${String(p.uid) === myUid() ? ' и титулы' : ''}</button></div>`;
}

let AV = null;
async function achvSheet(uid) {
  const own = String(uid) === myUid();
  const sh = sheet('<h2>Достижения</h2><p class="sub">Загрузка…</p>');
  const fail = e => { sh.innerHTML = `<h2>Достижения</h2><p class="sub">${esc(e || 'Не удалось загрузить')}</p><button class="btn g" data-a="close">Закрыть</button>`; };
  let data;
  if (own) {
    const r = await api('achievements');
    if (!sh.isConnected) return;
    if (!r.ok) return fail(r.error);
    data = r;
  } else {
    const r = await api('profile/' + uid);
    if (!sh.isConnected) return;
    const a = r.ok && r.profile.achv;
    if (!a) return fail(r.error);
    data = { items: a.list.map(x => ({ ...x, earned: true })), titles: [], active: null, earned: a.earned, total: a.total, cats: a.cats };
  }
  AV = { sh, data, own, f: 'all' };
  drawAchv();
}

function achvCard(x) {
  const pr = x.progress, pct = pr ? Math.round(pr.cur / pr.goal * 100) : 0;
  const where = x.season ? ' · сезон ' + x.season : x.scope === 'season' ? ' · в этом сезоне' : '';
  const past = !x.earned && x.times ? `<em>В прошлых сезонах: ×${x.times}</em>` : '';
  return `<div class="av-card ${x.earned ? 'on' : 'off'}" style="--ac:${x.color}"><i>${x.icon}</i><span>
    <b>${esc(x.name)}${x.title ? `<span class="ttl">👑 ${esc(x.title.name)}</span>` : ''}</b><small>${esc(x.desc)}</small>
    ${x.earned ? `<em>Получено ${dFmt(x.at)}${where}${x.times > 1 ? ' · всего ×' + x.times : ''}</em>` : pr ? `<div class="av-pb"><i style="width:${pct}%"></i></div><em>${pr.cur} / ${pr.goal}</em>` : ''}${past}
  </span><s>${esc(x.rl)}</s></div>`;
}

function drawAchv() {
  const { sh, data: d, own, f } = AV, st = sh.scrollTop;
  const items = d.items.filter(x => f === 'all' || (f === 'secret' ? x.secret : f === 'season' ? x.scope === 'season' : x.scope === 'permanent' && !x.secret));
  const cats = Object.keys(d.cats).filter(c => items.some(x => x.cat === c));
  const titles = own && d.titles?.length ? `<div class="av-sec" style="margin-top:12px">Титул рядом с ником</div><div class="av-tt">${d.titles.map(t =>
    `<button class="${t.unlocked ? (d.active === t.code ? 'on' : '') : 'lock'}" style="--ac:${t.color}" data-a="${t.unlocked ? 'settitle' : 'tthint'}" data-c="${esc(t.code)}">${t.unlocked ? t.icon : '🔒'} ${esc(t.name)}</button>`).join('')}${d.active ? '<button data-a="settitle" data-c="">Снять титул</button>' : ''}</div>` : '';
  sh.innerHTML = `<h2>Достижения <small class="sub">${d.earned}/${d.total}</small></h2>${titles}
    <div class="av-chips">${[['all', 'Все'], ['permanent', 'Постоянные'], ['season', 'Сезонные'], ['secret', 'Секретные']].map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-a="achvf" data-f="${k}">${l}</button>`).join('')}</div>
    ${cats.map(c => `<div class="av-sec">${esc(d.cats[c])}</div>${items.filter(x => x.cat === c).map(achvCard).join('')}`).join('') || '<p class="sub">Здесь пока пусто.</p>'}
    <button class="btn g" data-a="close" style="margin-top:8px">Закрыть</button>`;
  sh.scrollTop = st;
}

// «Смотреть интро» на главном экране: заново открывает ролик поверх приложения.
function replayIntro() {
  if ($('#intro')) return;
  const el = document.createElement('div'); el.id = 'intro'; el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#000';
  el.innerHTML = '<iframe id="introFrame" src="intro.html?host=1&r=' + Date.now() + '" style="width:100%;height:100%;border:0" allow="autoplay"></iframe><button id="introSkip" type="button">Пропустить интро ↗</button>';
  document.body.append(el);
  const fr = el.querySelector('iframe'); let tm;
  const end = () => { clearTimeout(tm); removeEventListener('message', onm); el.remove(); };
  const onm = e => { if (e.source === fr.contentWindow && e.data === 'olymp-intro-done') end(); };
  addEventListener('message', onm); el.querySelector('#introSkip').onclick = end; tm = setTimeout(end, 27000);
}

// Всплывающее окно «Достижение получено»: показывается, когда с сервера пришли награды, которых игрок ещё не видел
let achvQ = [], achvBusy = false;
function showNewAchv(tries = 0) {
  const u = P?.achv?.unseen; if (!u?.length || achvBusy) return;
  const intro = $('#intro'); // пока играет заставка, окно подождёт
  if (intro?.isConnected && getComputedStyle(intro).display !== 'none' && tries < 40) return void setTimeout(() => showNewAchv(tries + 1), 1000);
  achvBusy = true; achvQ = u.slice(); P.achv.unseen = [];
  api('achievements/seen', 'POST', { keys: achvQ.map(x => x.k) });
  nextAchv();
}
function nextAchv() {
  const a = achvQ.shift(); if (!a) { achvBusy = false; return; }
  const e = document.createElement('div'); e.className = 'avp'; e.style.setProperty('--ac', a.color);
  e.innerHTML = `<div class="avc"><small>${a.title ? 'ДОСТИЖЕНИЕ И ТИТУЛ' : 'ДОСТИЖЕНИЕ ПОЛУЧЕНО'}</small><i>${a.icon}</i><b>${esc(a.name)}</b><span>${esc(a.desc)}</span>
    <em>${esc(a.rl)}${a.season ? ' · сезон ' + a.season : ''}</em>${a.title ? `<u>👑 Открыт титул: ${esc(a.title.name)}</u>` : ''}</div>`;
  const next = () => { if (e.isConnected) { e.remove(); nextAchv(); } };
  e.onclick = next; document.body.append(e); buzz('success'); setTimeout(next, 5000);
}

function checkBadges() {
  if (!P?.badges) return;
  const k = 'olymp.b.' + myUid(); let seen = null;
  try { seen = JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(P.badges.map(b => b.t))); } catch { return; }
}

function maybeResult() {
  if (!RP || $('.ov')) return;
  const k = 'olymp.m.' + RP.id;
  try { if (localStorage.getItem(k)) return; localStorage.setItem(k, '1'); } catch { return; }
  matchSheet(RP.id, true);
}

// ── INITIALIZATION ──
let ready = false;
const _render = render;
render = function () {
  if (ready) return _render();
  setHTML($('#vh'), ''); setHTML($('#vb'), skel(4));
};

(async () => {
  render();
  await loadHeroes();
  if (GUEST) {
    ready = true; render();
    loadRating().then(render);
    loadMeta().then(() => { lastM = MC[metaKey()] || lastM; if (tab === 'meta') render(); });
    return;
  }

  await Promise.all([loadProfile(), loadLobby()]);
  if (P?.lobby?.lobby_id && P.lobby.lobby_id !== LID) { setLid(P.lobby.lobby_id); await loadLobby(); } // игрок уже сидит в другом лобби
  ready = true; render();
  loadRep().then(() => { render(); maybeResult(); });
  loadRating().then(render);
  loadMeta().then(() => { lastM = MC[metaKey()] || lastM; if (tab === 'meta') render(); });

  const poll = async () => {
    if (document.hidden || pend || $('.ov') || !['custom', 'home'].includes(tab)) return;
    const had = !!S.me; await loadLobby();
    if (had && !S.me) { await loadRep(); maybeResult(); loadProfile().then(render); }
    if (!pend && !$('.ov')) render();
  };
  setInterval(poll, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
})();
