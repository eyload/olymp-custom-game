<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>OLYMP CUSTOM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060608;--card:#0d0d10;--ink:#f5f5f6;--mut:#7d7d85;--ln:rgba(255,255,255,.09);--red:#ff2d3b;--g:255,45,59;
--sb:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
--st:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px));
--d:"Unbounded",system-ui,sans-serif;--m:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 13px/1.5 var(--m)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 40vmax at 0 0,rgba(var(--g),.16),transparent),radial-gradient(50vmax 40vmax at 100% 100%,rgba(var(--g),.12),transparent)}
button,input{font-family:var(--m)}
.hud{--c:rgba(255,45,59,.75);position:fixed;inset:8px;z-index:1;pointer-events:none;background:
linear-gradient(var(--c),var(--c)) 0 0/14px 1.5px,linear-gradient(var(--c),var(--c)) 0 0/1.5px 14px,
linear-gradient(var(--c),var(--c)) 100% 0/14px 1.5px,linear-gradient(var(--c),var(--c)) 100% 0/1.5px 14px,
linear-gradient(var(--c),var(--c)) 0 100%/14px 1.5px,linear-gradient(var(--c),var(--c)) 0 100%/1.5px 14px,
linear-gradient(var(--c),var(--c)) 100% 100%/14px 1.5px,linear-gradient(var(--c),var(--c)) 100% 100%/1.5px 14px;background-repeat:no-repeat}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 22px) 20px 0;min-height:100dvh;overflow-anchor:none}
#vb{transition:opacity .18s}#vb.busy{opacity:.45;pointer-events:none}
#ld{position:fixed;left:0;right:0;top:0;z-index:8;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);background-size:40% 100%;background-repeat:no-repeat;opacity:0;transition:opacity .15s;animation:ld 1s linear infinite}
#ld.on{opacity:1}@keyframes ld{from{background-position:-40% 0}to{background-position:140% 0}}
.top,.rh,.th{display:flex;justify-content:space-between;align-items:center;gap:12px}
.m{font:600 10px var(--m);letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.sub,small{color:var(--mut)}
h1{margin:26px 0 8px;font:900 clamp(24px,8vw,36px)/1.08 var(--d);text-transform:uppercase;letter-spacing:-.02em}
.rh h1{margin-top:22px}
h2{margin:0 0 6px;font:700 15px var(--d)}
mark{position:relative;display:inline-block;padding:0 .16em;color:#fff;background:rgba(var(--g),.92);box-shadow:0 0 28px rgba(var(--g),.55);outline:1px solid rgba(255,255,255,.5);outline-offset:4px;transform-origin:left}
[data-fresh] mark{animation:draw .6s .05s cubic-bezier(.2,.8,.2,1) both}
[data-fresh] #vb{animation:rise .28s ease-out both}
@keyframes draw{from{transform:scaleX(0);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.chip{display:flex;align-items:center;gap:8px;max-width:60%;height:32px;padding:0 12px;border:1px solid var(--ln);border-radius:99px;background:var(--card);color:var(--ink);font:600 11px var(--m);cursor:pointer;overflow:hidden;white-space:nowrap}
.chip img,.acc img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.box{position:relative;margin-top:14px;padding:16px;border:1px solid var(--ln);border-radius:4px;background:var(--card)}
.box.hl{border-color:rgba(var(--g),.55);box-shadow:inset 0 0 40px rgba(var(--g),.08)}
.big{margin-top:6px;font:900 44px/1 var(--d)}.big small{font:600 14px var(--m)}.big.sm{font-size:24px}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:14px}
.seg i{height:6px;background:rgba(255,255,255,.1)}.seg i.on{background:var(--red);box-shadow:0 0 10px rgba(var(--g),.7)}
.bar{height:4px;margin:14px 0 8px;background:rgba(255,255,255,.1)}.bar i{display:block;height:100%;background:var(--red);box-shadow:0 0 10px rgba(var(--g),.7);transition:width .7s}
.teams{display:grid;gap:0}@media(min-width:720px){.teams{grid-template-columns:1fr 1fr;gap:12px}}
.th{padding-bottom:10px;border-bottom:1px solid var(--ln);font:700 12px var(--d)}.th span{font:600 11px var(--m);color:var(--mut)}
.role,.row{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--ink);text-align:left;font:inherit}
.role{cursor:pointer;min-height:58px}.role:last-child,.row:last-child{border-bottom:0}
.role i,.row i{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--ln);border-radius:4px;font:700 10px var(--m);font-style:normal;color:#aaa}
.role span b,.row span b{display:block;font:600 13px var(--m)}.role small,.row small{font-size:11px}
.role em,.row em{font:700 11px var(--m);font-style:normal;color:var(--mut)}
.role.free em{padding:6px 10px;border-radius:4px;background:rgba(var(--g),.15);color:var(--red)}
.role.taken{opacity:.7;cursor:pointer}.role.mine{opacity:1}.role.mine i{background:var(--red);border-color:var(--red);color:#fff}.role.mine em{color:var(--red)}
.row.top i{color:var(--red);border-color:rgba(var(--g),.5)}.row.top em{color:#fff}
.pz{margin:10px 0 0}
.btn{display:block;width:100%;height:48px;margin-top:12px;border:1px solid transparent;border-radius:4px;background:var(--red);box-shadow:0 4px 24px rgba(var(--g),.35);color:#fff;font:700 11px var(--d);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.btn{transition:transform .12s}.btn:active{transform:scale(.98)}.btn.g{background:none;box-shadow:none;border-color:rgba(255,255,255,.18)}
.nav{position:fixed;left:50%;bottom:calc(var(--sb) + 16px);z-index:4;display:flex;gap:4px;padding:4px;transform:translateX(-50%);border:1px solid var(--ln);border-radius:99px;background:rgba(13,13,16,.88);backdrop-filter:blur(12px)}
.nav button{height:36px;padding:0 11px;transition:background .18s,color .18s;border:0;border-radius:99px;background:none;color:var(--mut);font:700 10.5px var(--m);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.nav button.on{background:var(--red);color:#fff}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.82);backdrop-filter:blur(8px)}
.sheet{width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:22px 18px calc(var(--sb) + 20px);border-top:2px solid var(--red);border-radius:16px 16px 0 0;background:var(--card)}
.fld{display:block;margin-top:12px;padding:10px 12px;border:1px solid var(--ln);border-radius:4px;background:#09090b}
.fld:focus-within{border-color:var(--red)}
.fld span{font:600 9px var(--m);letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.fld input{display:block;width:100%;margin-top:6px;border:0;background:none;outline:0;color:#fff;font:600 16px var(--m);caret-color:var(--red)}
.acc{display:flex;align-items:center;gap:12px;margin-top:12px}.acc img{width:44px;height:44px}.acc b{display:block}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);z-index:9;transform:translateX(-50%);max-width:90%;padding:10px 16px;border:1px solid var(--red);border-radius:4px;background:#161213;color:#fff;font:600 12px var(--m)}
.credit{max-width:560px;margin:28px auto 0;padding:16px 20px calc(var(--sb) + 96px);border-top:1px solid var(--ln);color:var(--mut);font:500 10px/1.6 var(--m);text-align:center}
.credit a{color:var(--red);text-decoration:none;font-weight:700}
.chips{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:30px;padding:0 12px;border:1px solid var(--ln);border-radius:99px;background:none;color:var(--mut);font:600 11px var(--m);cursor:pointer}
.chips button.on{border-color:var(--red);background:rgba(var(--g),.15);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:14px;border:1px solid var(--ln);background:var(--ln)}
.grid div{padding:10px 12px;background:var(--card)}.grid b{display:block;margin-top:2px;font:700 14px var(--d)}
.tier{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.tier:last-child{border-bottom:0}
.tier>i{display:grid;place-items:center;height:34px;border-radius:4px;background:#222;color:var(--mut);font:900 15px var(--d);font-style:normal}
.tier.S>i{background:var(--red);color:#fff}.tier.A>i{background:rgba(var(--g),.6);color:#fff}.tier.B>i{background:rgba(var(--g),.3);color:#fff}
.hs{display:flex;flex-wrap:wrap;gap:6px}.hs img,.row i img{width:38px;height:38px;border-radius:6px;object-fit:cover}.row i img{width:100%;height:100%}
.row i:has(img){border:0}
.ar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:13px}.ar:last-child{border-bottom:0}
.ar small{display:block;font-size:11px}
.ac{display:flex;gap:6px;flex:none}
.btn.x{display:inline-block;width:auto;height:34px;margin:0;padding:0 12px;font-size:10px}
.pm{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 0;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--ink);font:600 13px var(--m);text-align:left;cursor:pointer}
.pm i{flex:none;position:relative;width:44px;height:26px;border-radius:99px;background:#2a2a2a;transition:background .2s}
.pm i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.pm.on i{background:var(--red)}.pm.on i::after{transform:translateX(18px)}
.stabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;padding:4px;border:1px solid var(--ln);border-radius:4px;background:var(--bg)}
.stab{height:40px;border:0;border-radius:3px;background:none;color:var(--mut);font:700 11px var(--m);text-transform:uppercase;cursor:pointer}
.stab.on{background:var(--red);color:#fff}
.er{min-height:18px;margin-top:6px;color:#ff6b75;font-size:12px}
.sheet .m.l{display:block;margin-top:18px}
.fld input[type=datetime-local]{color-scheme:dark}
.skl{height:58px;margin-top:10px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04)) 0 0/200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.pc{cursor:pointer}.pc .acc{margin-top:0}.pc .grid{margin-top:12px}.pc .grid div{padding:8px 10px}.pc .grid b{font-size:13px}
.pc .idl{margin-left:auto;font:600 11px var(--m);color:var(--mut);text-align:right}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-height:112px;padding:14px;border:1px solid var(--ln);border-radius:4px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer;transition:transform .12s,border-color .2s}
.tile:active{transform:scale(.97)}.tile:hover{border-color:rgba(var(--g),.45)}
.tile svg{width:26px;height:26px;stroke:var(--red);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font:700 13px var(--d)}.tile small{display:block;margin-top:2px;font-size:11px}
.tile.w{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}.tile.w div{flex:1}
.hp{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border:1px solid var(--ln);border-radius:99px;font:600 11px var(--m);white-space:nowrap}
.hp img,.ph{width:22px;height:22px;border-radius:50%;object-fit:cover}
.hp .ph{font-size:8px}.hp small{font-size:10px}.hp.nm{padding-left:10px}
.ph{display:inline-grid;place-items:center;background:#1c1c20;color:var(--mut);font:700 9px var(--m);font-style:normal}
.row i .ph{width:100%;height:100%;border-radius:0}
.tier .hs{gap:5px}
.src{margin-top:12px;font-size:10px;line-height:1.5;color:var(--mut)}.src a{color:var(--red);text-decoration:none;font-weight:700}
.bh{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.bh small{display:block;font-size:11px}.bh i{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--ln);border-radius:4px;overflow:hidden;font-style:normal}
.bh em{font:700 11px var(--m);font-style:normal;color:var(--mut);transition:transform .2s}.bh.o em{transform:rotate(90deg);color:var(--red)}
.bd{padding:2px 0 12px 48px}
.bk{margin-top:8px;padding:10px;border:1px solid var(--ln);border-radius:4px;background:#09090b}
.bk b{font:700 12px var(--m)}.bk .tg{margin-left:6px;padding:1px 6px;border-radius:99px;background:rgba(var(--g),.15);color:var(--red);font:600 9px var(--m);text-transform:uppercase}
.it{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.it span{padding:4px 8px;border:1px solid var(--ln);border-radius:4px;font:600 11px var(--m)}
.bk .m{margin-top:8px;display:block;text-transform:none;letter-spacing:0}
.rk{font:900 40px/1 var(--d)}
.empty{padding:18px 0;color:var(--mut);text-align:center}
.row[data-a]{cursor:pointer}
.pf .acc{margin-top:0}.bio{margin:10px 0 0;color:var(--ink);font-size:12px;opacity:.85}
.pw{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}.pw svg{flex:none}
.pw b{display:block;margin-top:2px;font:700 15px var(--d)}.pw small{display:block;margin-top:2px;font-size:11px}
.tb{display:inline-block;margin-left:4px;padding:0 6px;border-radius:99px;background:#222;color:var(--mut);font:700 9px var(--m);vertical-align:1px}
.tb.S{background:var(--red);color:#fff}.tb.A{background:rgba(var(--g),.55);color:#fff}.tb.B{background:rgba(var(--g),.25);color:#fff}
.bm{position:relative;display:flex;height:6px;margin:14px 0 8px;background:rgba(255,255,255,.3)}.bm i{background:var(--red);box-shadow:0 0 10px rgba(var(--g),.7);transition:width .5s}
.bm::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:#fff}
.bl{display:flex;justify-content:space-between;font:600 11px var(--m);color:var(--mut)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:10px;border:1px dashed rgba(var(--g),.5);border-radius:4px;font-size:12px}
.sw small{display:block;margin-top:2px;font-size:11px}
.pk{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:99px;background:rgba(var(--g),.15);color:var(--red);font:700 10px var(--m);font-style:normal}
.er a,.er button{color:var(--red)}
.bdg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bg{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--ln);border-radius:4px;background:#09090b}
.bg>i{font-style:normal;font-size:20px}.bg b{display:block;font:700 11px var(--m)}.bg small{display:block;font-size:10px;line-height:1.3}
.bi{margin-left:4px;font-size:11px;letter-spacing:2px}
.row i.rw{color:#4ade80;border-color:rgba(74,222,128,.45)}.row i.rl{color:var(--red);border-color:rgba(var(--g),.5)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);text-align:center}
.cmp:last-child{border-bottom:0}.cmp b{font:700 14px var(--d);color:var(--mut)}.cmp b.w{color:var(--red)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Тема v2: мягче, глубже, спокойнее ── */
:root{--bg:#08080c;--card:#111116;--ink:#f4f4f7;--mut:#8b8b97;--ln:rgba(255,255,255,.08);--red:#ff3d4d;--g:255,61,77;--gold:#ffc65c;--ok:#4ade80;--r:14px}
body::before{background:radial-gradient(70vmax 50vmax at 0 -10%,rgba(var(--g),.17),transparent 60%),radial-gradient(60vmax 45vmax at 100% 105%,rgba(110,90,255,.11),transparent 60%),radial-gradient(40vmax 30vmax at 100% 0,rgba(255,198,92,.05),transparent)}
.hud{--c:rgba(255,61,77,.32)}
h1{font-size:clamp(24px,7.4vw,34px)}
mark{border-radius:8px;box-shadow:0 0 30px rgba(var(--g),.4);outline:1px solid rgba(255,255,255,.22)}
.box,.tile{border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 45%),var(--card);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 30px -20px #000}
.box.hl{border-color:rgba(var(--g),.4);background:linear-gradient(160deg,rgba(var(--g),.13),transparent 55%),var(--card)}
.btn{height:50px;border-radius:12px;background:linear-gradient(180deg,#ff5462,#ef2d3e);box-shadow:0 10px 24px -10px rgba(var(--g),.7),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s,filter .2s}
.btn:hover{filter:brightness(1.06)}
.btn.g{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.12);box-shadow:none}
.btn.x{height:34px;border-radius:9px}.btn:disabled{opacity:.6}
.fld{border-radius:12px;background:#0b0b0f}.fld:focus-within{box-shadow:0 0 0 3px rgba(var(--g),.14)}
.nav{background:rgba(17,17,22,.82);box-shadow:0 12px 30px -10px #000}
.chip{background:rgba(17,17,22,.8)}
.sheet{border-radius:24px 24px 0 0;border-top:1px solid rgba(var(--g),.45);background:linear-gradient(180deg,#16161c,#101014);box-shadow:0 -24px 60px -24px rgba(var(--g),.3);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:38px;height:4px;margin:-8px auto 16px;border-radius:4px;background:rgba(255,255,255,.18)}
.ov{animation:fade .18s}
@keyframes up{from{transform:translateY(28px);opacity:0}}@keyframes fade{from{opacity:0}}
.role i,.row i,.bh i,.tier>i{border-radius:10px}.role.free em{border-radius:8px}
.seg i{height:7px;border-radius:3px}.bar,.bar i{border-radius:4px}
.grid{border-radius:12px;overflow:hidden}.stabs{border-radius:12px}.stab{border-radius:9px}
.skl{border-radius:12px}.bk,.sw,.bg{border-radius:10px}.it span{border-radius:8px}
.toast{border-radius:12px;background:#18161b;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.role.free:active,.row[data-a]:active{background:rgba(255,255,255,.03)}
.role i[style]{border-color:var(--fc);color:var(--fc)}
/* рамки аватаров по уровню Power */
.av{flex:none;display:inline-grid;place-items:center;border-radius:50%;background:conic-gradient(from 200deg,var(--fc),rgba(255,255,255,.2),var(--fc));box-shadow:0 0 14px -3px var(--fc)}
.av img,.av .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;border:var(--bw,2px) solid var(--bg);background:#1c1c20}
.acc .av{margin:0}
/* анимации */
.rc{animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes ringin{from{stroke-dasharray:0 200}}
.rs{stroke:var(--red)}
.radar{display:block;width:100%;max-width:300px;margin:6px auto 0}
.rd{fill:rgba(var(--g),.28);stroke:var(--red);stroke-width:2;stroke-linejoin:round;transform-box:view-box;transform-origin:50% 50%;animation:radin .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes radin{from{transform:scale(.15);opacity:0}}
.cf{position:fixed;inset:0;z-index:40;pointer-events:none}
.bf{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);animation:fade .2s}
.bfc{width:min(300px,84vw);padding:26px 20px;text-align:center;border:1px solid rgba(255,198,92,.55);border-radius:20px;background:linear-gradient(160deg,rgba(255,198,92,.18),#111116 60%);box-shadow:0 0 70px -10px rgba(255,198,92,.55);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.bfc>i{display:block;font-style:normal;font-size:64px;line-height:1.1;filter:drop-shadow(0 0 18px rgba(255,198,92,.7))}
.bfc b{display:block;margin-top:8px;font:900 18px var(--d)}.bfc small{display:block;margin-top:6px;color:var(--mut)}.bfc .m{margin-top:10px;color:var(--gold)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
/* экран итогов матча */
.mres{text-align:center;padding:4px 0}.mres .big2{margin:6px 0 2px;font:900 28px/1.1 var(--d)}
.mres.win .big2{color:var(--ok)}.mres.lose .big2{color:var(--red)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 0;text-align:center}
.vs b{font:900 34px var(--d)}.vs span{font:600 10px/1.5 var(--m);color:var(--mut)}
.tm{margin-top:10px;padding:8px 12px;border:1px solid var(--ln);border-radius:12px;background:#0b0b0f}
.tm.w{border-color:rgba(255,198,92,.5);box-shadow:inset 0 0 30px rgba(255,198,92,.07)}
.row.mv{padding-left:6px;border-radius:10px;background:linear-gradient(90deg,rgba(255,198,92,.16),transparent)}.row.mv em{color:var(--gold)}
.mvpc{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid rgba(255,198,92,.45);border-radius:12px;background:linear-gradient(120deg,rgba(255,198,92,.16),transparent);box-shadow:0 0 30px -12px rgba(255,198,92,.6)}
.mvpc b{display:block;font:700 15px var(--d)}.mvpc .m{color:var(--gold)}
.cardimg{display:block;width:100%;margin-top:12px;border:1px solid var(--ln);border-radius:14px}
.ov.still,.ov.still .sheet{animation:none}
</style>
</head>
<body>
<div class="hud"></div>
<div id="ld"></div>
<div id="app"><div id="top"></div><main id="view"><div id="vh"></div><div id="vb"></div></main></div>
<nav class="nav" id="nav"></nav>
<div class="credit">
  © 2026 OLYMP CUSTOM. Все права на материалы MLBB принадлежат <strong>Moonton</strong>.<br>
  Данные интеграции: <a href="https://github.com/ridwaanhall/rone-arena-python" target="_blank" rel="noopener">Rone Arena API</a> (разработка <strong>ridwaanhall / RoneAI</strong>).<br>
  Мета: <a href="https://mlbbhub.com" target="_blank" rel="noopener">mlbbhub.com</a>, <a href="https://www.playnews.gg" target="_blank" rel="noopener">playnews.gg</a>.<br>
  Создано при поддержке бота <a href="https://t.me/refillstorebot?start=aff_5100806492" id="refillLink">REFILL</a>
</div>

<script>
const tg = Telegram.WebApp;
tg.ready(); tg.expand();
try { tg.disableVerticalSwipes?.(); } catch {}

const ROLES = [['jungle', 'Jungle', 'JG'], ['exp', 'EXP', 'EX'], ['mid', 'Mid', 'MD'], ['gold', 'Gold', 'GD'], ['roam', 'Roam', 'RM']];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const roleName = k => ROLES.find(r => r[0] === k)?.[1] || k;
const myUid = () => String(tg.initDataUnsafe?.user?.id ?? '');

let APPURL = null;
let S = { players: [], count: 0, me: null, admin: false, mvpRp: 25 }, P = null, R = null, RP = null, tab = 'home', acc = {}, pend = 0, draftOpen = false;
const mf = { rank: 'mythic', days: 7, sort: 'wr', sec: 'tier', lane: 'all' }, MC = {}, openB = new Set();
let lastM = null;

// ── Сеть: таймаут, индикатор загрузки сверху ──
let busyN = 0;
const busy = on => { busyN += on ? 1 : -1; $('#ld').classList.toggle('on', busyN > 0); };
const ERR = { auth: 'Сессия Telegram устарела. Закрой и снова открой приложение', rate_limited: 'Слишком часто. Подожди пару секунд', server: 'Ошибка сервера. Попробуй ещё раз' };
// ms: сколько ждём ответ. Медленные операции (подтверждение через игру, мета) получают больше времени.
// GET при сетевом сбое повторяется один раз. Таймаут и обрыв связи показываются по-разному.
async function api(path, method = 'GET', body, ms = 12000) {
  for (let i = 0; ; i++) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
    try {
      const r = await fetch('/api/' + path, { method, body: body && JSON.stringify(body), signal: ac.signal,
        headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg.initData } });
      const j = await r.json().catch(() => ({}));
      const error = j.error ? ERR[j.error] || j.error : r.ok ? undefined : r.status >= 500 ? 'Сервер временно недоступен, попробуй позже' : 'Ошибка ' + r.status;
      return { ...j, ok: r.ok, status: r.status, error };
    } catch (e) {
      if (e.name === 'AbortError') return { ok: false, error: 'Сервер долго отвечает. Попробуй ещё раз' };
      if (method === 'GET' && i === 0) { await new Promise(r => setTimeout(r, 700)); continue; }
      return { ok: false, error: 'Нет связи с сервером' };
    } finally { clearTimeout(t); }
  }
}
const bg = async fn => { busy(1); try { return await fn(); } finally { busy(0); } };
const loadProfile = async () => { const r = await api('profile'); if (r.ok) { P = r.profile; APPURL = r.appUrl || APPURL; checkBadges(); } };
const loadLobby = async () => { const r = await api('lobby'); if (r.ok) S = r; };
const loadRep = async () => { const r = await api('rep/pending'); if (r.ok) RP = r.match; };
const loadRating = () => bg(async () => { const r = await api('rating'); if (r.ok) R = r; });
const metaKey = () => mf.rank + mf.days;
const metaRetry = new Set();
const loadMeta = () => bg(async () => {
  if (MC[metaKey()]?.error) delete MC[metaKey()];
  const k = metaKey(), r = await api(`meta?rank=${mf.rank}&days=${mf.days}`, 'GET', null, 20000);
  if (r.ok) {
    MC[k] = r;
    // сервер отдал сохранённый срез, пока живые данные грузятся в фоне: один раз заглядываем снова
    if (!r.live && !metaRetry.has(k)) { metaRetry.add(k); setTimeout(async () => { await loadMeta(); if (tab === 'meta' && metaKey() === k) { lastM = MC[k] || lastM; render(); } }, 8000); }
  } else if (!lastM) MC[k] = { error: r.error || 'Не удалось загрузить' };
});

const tap = () => { try { tg.HapticFeedback?.impactOccurred('light'); } catch {} };
function toast(t) {
  const e = document.createElement('div'); e.className = 'toast'; e.textContent = t;
  document.body.append(e); setTimeout(() => e.remove(), 2600);
}
function sheet(html) {
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = '<div class="sheet">' + html + '</div>';
  o.onclick = e => { if (e.target === o) o.remove(); };
  document.body.append(o); return o.firstChild;
}
const fld = (label, id, ph, v) => `<label class="fld"><span>${label}</span><input id="${id}" value="${esc(v)}" placeholder="${ph}" inputmode="numeric" autocomplete="off"></label>`;

// ── Кольцо: сколько дней осталось до конца сезона ──
const ring = (left, total) => {
  const c = 2 * Math.PI * 24, f = Math.max(0, Math.min(1, left / (total || 1)));
  return `<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/>
  <circle cx="28" cy="28" r="24" class="rs" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 28 28)"/>
  <text x="28" y="32" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-weight="800" font-size="12">${left}д</text></svg>`;
};
const repBox = () => RP && RP.players.some(p => p.val == null) ? `<div class="box hl"><b>Матч завершён</b><div class="sub">Оцени игроков: плюс за адекватность, минус за токсичность, АФК или слив.</div><button class="btn" data-a="rep">Оценить игроков</button><button class="btn g" data-a="match" data-m="${RP.id}">Итоги матча</button></div>` : '';
const fmtDay = d => new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
const skel = n => Array.from({ length: n }, () => '<div class="skl"></div>').join('');

// ── Профиль игрока (карточка с ID, Power и винрейтом) ──
const cell = (l, v) => `<div><span class="m">${l}</span><b>${esc(v ?? '—')}</b></div>`;
const wrTxt = st => st?.wr != null ? st.wr + '%' : null;
function pcard() {
  if (!P?.mlbbId) return `<div class="box pc" data-a="go-profile"><div class="m">Профиль MLBB</div><h2 style="margin-top:8px">Привяжи аккаунт</h2><div class="sub">Укажи ID и Zone ID, чтобы занимать роли и видеть свой ранг.</div><button class="btn" style="margin-top:12px">Привязать</button></div>`;
  const st = P.stats;
  return `<div class="box hl pc" data-a="go-profile"><div class="acc">${av(P.avatar, P.power, 48)}
    <div><b>${esc(P.nick || 'Игрок')}${P.verified ? ' ✓' : ''}</b><small>${P.verified ? 'Аккаунт подтверждён' : 'Не подтверждён'}${P.level ? ' · ур. ' + esc(P.level) : ''}</small></div>
    <div class="idl">ID<br><b style="color:var(--ink)">${esc(P.mlbbId)}</b> (${esc(P.mlbbZone)})</div></div>
    ${(P.verified || st) ? `<div class="grid" style="grid-template-columns:repeat(3,1fr)">${cell('Power', P.power)}${cell('Винрейт', wrTxt(st))}${cell('Матчей', st?.matches)}</div>
      ${!st ? '<div class="sub" style="margin-top:8px;font-size:11px">Статистика пока не получена. Открой профиль и нажми «Обновить данные из игры».</div>' : ''}`
      : '<div class="sub" style="margin-top:10px;font-size:11px">Подтверди аккаунт кодом из игровой почты, и здесь появятся Power и статистика.</div>'}</div>`;
}

// ── Экраны ──
const ICON = {
  lobby: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17 14.2c2.3.3 4 2.2 4 4.8"/></svg>',
  rating: '<svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5"/><path d="M12 14v4M8.5 20h7"/></svg>',
  meta: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>',
  game: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>',
  panel: '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 7.7-8 9-4.8-1.3-8-4.5-8-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>',
};
const tile = (a, ic, t, s, extra = '') => `<button class="tile${extra}" data-a="${a}">${ICON[ic]}<div><b>${t}</b><small class="sub">${s}</small></div></button>`;

function homeView() {
  const sn = R?.season;
  return { head: `<h1>Главное <mark>меню</mark></h1><div class="sub">Mobile Legends · кастомки 5×5</div>${pcard()}`,
    body: `${repBox()}<div class="tiles">
      ${tile('go-custom', 'lobby', 'Лобби', `${S.count} / 10 игроков${S.me ? ' · ты в игре' : ''}`)}
      ${tile('go-rating', 'rating', 'Рейтинг', sn ? `Сезон ${sn.number} · ${sn.left} дн.` : 'Топ сезона')}
      ${tile('go-meta', 'meta', 'Мета', 'Тир-лист, сборки, предметы')}
      ${tile('go-profile', 'user', 'Профиль', P?.power != null ? 'Power ' + P.power : P?.mlbbId ? 'ID ' + esc(P.mlbbId) : 'Привязать аккаунт')}
      ${hasGame() ? tile('gadm', 'game', 'Управление игрой', 'Время, комната, набор', ' w') : ''}
      ${hasPanel() ? tile('pnl', 'panel', 'Админ-панель', 'Персонал, баны, журнал', ' w') : ''}
    </div>` };
}

// ── Баланс команд: среднее Power по каждой стороне и лучший обмен игроков одной роли ──
const teamStat = (pl, n) => { const r = pl.filter(p => p.team === n && p.power != null); return { n: r.length, sum: r.reduce((s, p) => s + p.power, 0) }; };
const gap = (sa, na, sb, nb) => Math.abs(sa / na - sb / nb), pctOf = g => Math.max(0, Math.round(100 - g * 3));
function balance(pl) {
  const A = teamStat(pl, 1), B = teamStat(pl, 2);
  if (!A.n || !B.n) return null;
  const g = gap(A.sum, A.n, B.sum, B.n); let best = null;
  for (const [k] of ROLES) {
    const pa = pl.find(p => p.team === 1 && p.role === k && p.power != null), pb = pl.find(p => p.team === 2 && p.role === k && p.power != null);
    if (!pa || !pb) continue;
    const g2 = gap(A.sum - pa.power + pb.power, A.n, B.sum - pb.power + pa.power, B.n);
    if (g2 < g - 2 && (!best || g2 < best.g2)) best = { role: k, pa, pb, g2 };
  }
  return { a: Math.round(A.sum / A.n), b: Math.round(B.sum / B.n), pct: pctOf(g), skip: pl.filter(p => p.power == null).length, best };
}
function balanceBox() {
  const B = balance(S.players); if (!B) return '';
  const tot = B.a + B.b || 1, v = B.pct >= 90 ? 'Почти идеально ровно' : B.pct >= 75 ? 'Играбельно' : B.pct >= 55 ? 'Есть перекос' : 'Сильный перекос';
  const x = B.best;
  return `<div class="box"><div class="th"><b>Баланс команд</b><span>${B.pct}%</span></div>
    <div class="bm"><i style="width:${B.a / tot * 100}%"></i></div>
    <div class="bl"><span>Команда 1 · ⚡${B.a}</span><span>Команда 2 · ⚡${B.b}</span></div>
    <p class="sub" style="margin:8px 0 0;font-size:11px">${v}${B.skip ? ` · без статистики: ${B.skip}` : ''}. Power считается из винрейта и опыта.</p>
    ${x ? `<div class="sw"><span>Обмен на позиции ${esc(roleName(x.role))}: <b>${esc(x.pa.name)}</b> ⇄ <b>${esc(x.pb.name)}</b><small class="sub">Баланс ${B.pct}% → ${pctOf(x.g2)}%</small></span>${can('kick') ? `<button class="btn x" data-a="swap" data-r="${x.role}">Обменять</button>` : ''}</div>` : ''}</div>`;
}

function lobbyView() {
  const { players, count, me, admin } = S;
  const team = t => `<div class="box"><div class="th"><b>Команда ${t}</b><span>${players.filter(p => p.team === t).length}/5</span></div>` +
    ROLES.map(([k, n, ab]) => {
      const p = players.find(p => p.team === t && p.role === k), mine = p && me && p.uid === me.uid;
      return `<button class="role ${mine ? 'mine' : p ? 'taken' : 'free'}" ${p ? `data-a="pview" data-u="${esc(p.uid)}"` : `data-a="claim" data-t="${t}" data-r="${k}"`}>
        <i${p && p.power != null ? ` style="--fc:${PWC[pwIdx(p.power)]}"` : ''}>${ab}</i><span><b>${n}</b><small>${p ? esc(p.name) : 'свободно'}</small></span><em>${mine ? 'ты' : p ? (p.power != null ? '⚡' + p.power : 'занято') : 'занять'}</em></button>`;
    }).join('') + '</div>';
  return { head: `<h1>Собери <mark>состав</mark></h1><div class="sub">Mobile Legends · кастомка 5×5</div>`,
    body: `<div class="box"><div class="m">Лобби</div><div class="big">${String(count).padStart(2, '0')}<small> / 10</small></div>
    <div class="seg">${Array.from({ length: 10 }, (_, i) => `<i class="${i < count ? 'on' : ''}"></i>`).join('')}</div></div>
    ${repBox()}
    ${balanceBox()}
    ${draftBox()}
    ${pcard()}
    ${me ? `<div class="box hl"><b>Команда ${me.team} · ${esc(roleName(me.role))}</b><button class="btn g" data-a="rel">Освободить роль</button></div>` : ''}
    ${admin ? `<button class="btn" data-a="finish">Завершить матч · MVP</button>` : ''}${hasGame() ? '<button class="btn g" data-a="gadm">Управление игрой</button>' : ''}${hasPanel() ? '<button class="btn g" data-a="pnl">Админ-панель</button>' : ''}
    <div class="teams">${team(1)}${team(2)}</div>` };
}

// Рейтинг: только очки (RP), без рангов. Сезон и его длина как в MLBB
function ratingView() {
  const head = `<h1>Рейтинг <mark>сезона</mark></h1>`;
  if (!R) return { head, body: skel(4) };
  const { season: s, me: m, leaderboard: l, prizes, mvpRp } = R, done = Math.max(0, Math.min(100, (s.days - s.left) / (s.days || 1) * 100));
  return { head: `<div class="rh"><div><h1>Сезон ${esc(s.number)}</h1><div class="sub">Как в MLBB · сезон длится ${s.days} дн.</div></div>${ring(s.left, s.days)}</div>`,
    body: `<div class="box hl"><div class="m">Твой рейтинг</div><div class="big">${m.rating}<small> RP</small></div>
      <div class="sub">${m.place ? `${m.place} место · ` : ''}${m.mvp} MVP</div>
      <div class="bar"><i style="width:${done}%"></i></div><div class="m">До конца сезона ${s.left} из ${s.days} дн.</div></div>
    <div class="sub" style="margin-top:16px">MVP в кастомке = <mark>+${mvpRp} RP</mark></div>
    <div class="box"><div class="th"><b>Топ сезона</b><span>RP</span></div>${l.length ? l.map((u, i) => `<div class="row${i < 3 ? ' top' : ''}" data-a="pview" data-u="${esc(u.uid)}"><i>${av(u.avatar, u.power, 36)}</i><span><b>${i + 1}. ${esc(u.name)}<span class="bi">${(u.badges || []).map(b => `<span title="${esc(b.t)}">${b.i}</span>`).join('')}</span></b><small>${u.mvp} MVP</small></span><em>${u.rating}</em></div>`).join('') : '<p class="sub">Пока пусто. Стань первым MVP сезона.</p>'}</div>
    ${R.hall?.length ? `<div class="box"><div class="th"><b>Зал славы</b><span>прошлые сезоны</span></div>${R.hall.map(h => `<div class="ar"><span><b>Сезон ${esc(h.number)}</b><small>${h.top.map((t, i) => `${['🥇', '🥈', '🥉'][i]} ${esc(t.name)} · ${t.rating} RP`).join('<br>')}</small></span></div>`).join('')}</div>` : ''}
    <div class="box"><div class="th"><b>Призы сезона</b></div>${prizes?.length ? prizes.map(p => `<p class="pz">${esc(p)}</p>`).join('') : '<p class="sub">Призы будут объявлены позже.</p>'}</div>` };
}

// ── Мета: тир-лист, сборки, предметы ──
const RK = [['all', 'Все'], ['epic', 'Эпик'], ['legend', 'Легенда'], ['mythic', 'Мифик'], ['honor', 'Мифическая честь'], ['glory', 'Мифическая слава']], DY = [1, 3, 7, 15, 30], SORT = [['wr', 'Винрейт'], ['pick', 'Пик'], ['ban', 'Бан']];
const SEC = [['tier', 'Тир-лист'], ['builds', 'Сборки'], ['items', 'Предметы']], LANES = [['all', 'Все'], ['Jungle', 'Лес'], ['EXP', 'Опыт'], ['Gold', 'Золото'], ['Mid', 'Мид'], ['Roam', 'Роум']], laneRu = k => LANES.find(l => l[0] === k)?.[1] || k;
const chips = (arr, k, cur) => `<div class="chips">${arr.map(([v, n]) => `<button data-a="mf" data-k="${k}" data-v="${v}" class="${String(v) === String(cur) ? 'on' : ''}">${n}</button>`).join('')}</div>`;
const ini = n => esc(String(n).replace(/[^A-Za-zА-Яа-яЁё]/g, '').slice(0, 2).toUpperCase() || '?');
const himg = h => h.img ? `<img src="${esc(h.img)}" alt="${esc(h.name)}" loading="lazy" referrerpolicy="no-referrer">` : `<i class="ph">${ini(h.name)}</i>`;
const link = (u, t) => `<a href="#" data-a="link" data-u="${esc(u)}">${esc(t)}</a>`;
const fmtD = d => new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

function metaView() {
  const M = MC[metaKey()] || lastM, showFilters = mf.sec === 'tier' && (!M || M.live);
  const head = `<h1>Мета <mark>героев</mark></h1><div class="sub">Тир-лист, популярные сборки и предметы</div>
    <div class="stabs" style="grid-template-columns:repeat(3,1fr)">${SEC.map(([k, n]) => `<button class="stab${k === mf.sec ? ' on' : ''}" data-a="mf" data-k="sec" data-v="${k}">${n}</button>`).join('')}</div>

const GAME_PERMS = ['time', 'room', 'broadcast', 'lock', 'kick', 'ban', 'reset'];
const PANEL = [['staff', 'Персонал и права', () => openStaff()], ['rep', 'Репутация игроков', () => openRep()], ['ban', 'Баны', () => openBans()], ['log', 'Журнал действий', () => openLog()]];
const hasGame = () => GAME_PERMS.some(can), hasPanel = () => PANEL.some(([p]) => can(p));
const fmtShort = d => new Date(d).toLocaleString('ru-RU', { timeZone: 'Asia/Bishkek', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const hf = (label, id, ph, v, type = 'text') => `<label class="fld"><span>${label}</span><input id="${id}" type="${type}" value="${esc(v)}" placeholder="${ph}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>`;
const ask = (t, fn) => tg.showConfirm(t, ok => ok && fn());
const bind = (sh, sel, fn) => { const e = sh.querySelector(sel); if (e) e.onclick = fn; };
// Открывает лист, закрывая предыдущий; keep = сохранить прокрутку при обновлении того же листа
function asheet(html, keep) {
  const sc = keep ? $('.ov .sheet')?.scrollTop || 0 : 0;
  document.querySelectorAll('.ov').forEach(o => o.remove());
  const sh = sheet(html); sh.scrollTop = sc; if (keep) sh.parentNode.classList.add('still'); return sh;
}
const closeAll = () => document.querySelectorAll('.ov').forEach(o => o.remove());

// ---- Управление текущей игрой ----
function openAdmin(keep) {
  const loc = d => new Date(new Date(d).getTime() + 6 * 3600000).toISOString().slice(0, 16); // Бишкек = UTC+6
  const sh = asheet(`<h2>Управление игрой</h2><p class="sub">Твоя роль: ${ROLE_NAME[S.role] || '—'}</p>` +
    (can('time') ? hf('Старт игры (Бишкек, UTC+6)', 'dt', '', S.startsAt ? loc(S.startsAt) : '', 'datetime-local') +
      '<div class="er" id="er"></div><button class="btn" id="sv">Сохранить время</button><button class="btn g" id="cl">Убрать время</button>' : '') +
    (can('room') ? hf('Код комнаты (видят игроки с ролью)', 'rm', 'например 12345678', S.roomCode || '') + '<button class="btn g" id="rmb">Сохранить код</button>' : '') +
    (can('broadcast') ? hf('Сообщение игрокам с ролью', 'bc', 'Текст рассылки') + '<button class="btn g" id="bcb">Отправить всем</button><button class="btn g" id="rmd">Напомнить не подтвердившим</button>' : '') +
    (can('lock') ? `<button class="btn g" id="lk">${S.locked ? 'Открыть набор' : 'Закрыть набор'}</button>` : '') +
    '<div class="m l">Игроки</div>' +
    (S.players.length ? S.players.map(p => `<div class="ar"><span><b>${esc(p.name || p.username)}</b><small>К${p.team}, ${esc(roleName(p.role))}</small></span><span class="ac">` +
      (can('kick') ? `<button class="btn g x" data-k="${esc(p.uid)}">Убрать</button>` : '') +
      (can('ban') ? `<button class="btn g x" data-b="${esc(p.uid)}" data-n="${esc(p.name || p.username)}">Бан</button>` : '') + '</span></div>').join('') : '<p class="sub">Пока никого.</p>') +
    (can('reset') ? '<button class="btn g" id="rs">Сбросить лобби</button>' : '') + '<button class="btn" id="no">Закрыть</button>', keep);
  const act = async (path, body, ok) => {
    const r = await api('admin/' + path, 'POST', body);
    if (!r.ok) return toast(em(r));
    if (r.players) { S = r; render(); }
    toast(typeof ok === 'function' ? ok(r) : ok); openAdmin(true);
  };
  bind(sh, '#sv', () => {
    const v = sh.querySelector('#dt').value;
    if (!v) return void (sh.querySelector('#er').textContent = 'Выбери дату и время.');
    act('time', { startsAt: new Date(v + ':00+06:00').toISOString() }, 'Время сохранено');
  });
  bind(sh, '#cl', () => act('time', { startsAt: null }, 'Время убрано'));
  bind(sh, '#rmb', () => act('room', { code: sh.querySelector('#rm').value }, 'Код сохранён'));
  bind(sh, '#bcb', () => { const t = sh.querySelector('#bc').value.trim(); if (t) act('broadcast', { text: t }, r => `Рассылка отправлена: ${r.sent}`); });
  bind(sh, '#rmd', () => act('remind', {}, r => `Напоминание отправлено: ${r.sent}`));
  bind(sh, '#lk', () => act('lock', { locked: !S.locked }, S.locked ? 'Набор открыт' : 'Набор закрыт'));
  sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => act('kick', { uid: b.dataset.k }, 'Игрок убран'));
  sh.querySelectorAll('[data-b]').forEach(b => b.onclick = () => ask(`Забанить ${b.dataset.n}? Он потеряет роли во всех играх и не сможет занимать новые.`,
    () => act('ban', { uid: b.dataset.b, username: b.dataset.n }, 'Игрок забанен')));
  bind(sh, '#rs', () => ask('Сбросить лобби? Все роли освободятся.', () => act('reset', {}, 'Лобби сброшено')));
  bind(sh, '#no', closeAll);
}

// ---- Глобальная админ-панель ----
function openPanel(keep) {
  const sh = asheet(`<h2>Админ-панель</h2><p class="sub">Твоя роль: ${ROLE_NAME[S.role] || '—'}</p>` +
    PANEL.filter(([p]) => can(p)).map(([p, n]) => `<button class="btn g" data-o="${p}">${n}</button>`).join('') + '<button class="btn" id="no">Закрыть</button>', keep);
  sh.querySelectorAll('[data-o]').forEach(b => b.onclick = () => PANEL.find(x => x[0] === b.dataset.o)[2]());
  bind(sh, '#no', closeAll);
}

async function openStaff(keep) {
  const r = await api('admin/staff');
  if (!r.ok) return void toast(em(r));
  const nm = x => x.handle ? '@' + esc(x.handle) : 'id ' + esc(x.uid);
  const sh = asheet(`<h2>Персонал и права</h2><p class="sub">Владельцы заданы на сервере (переменная ADMINS): у них всегда все права, убрать их здесь нельзя. Остальным права выдаёшь ты, по каждому отдельно.</p>
    <div class="m l">Владельцы</div>` +
    (r.owners.length ? r.owners.map(o => `<div class="ar"><span>${/^\d+$/.test(o) ? 'id ' : '@'}${esc(o)}</span><small>Владелец</small></div>`).join('') : '<p class="sub">Не заданы.</p>') +
    '<div class="m l">Админы и модераторы</div>' +
    (r.staff.length ? r.staff.map(x => `<div class="ar"><span><b>${nm(x)}</b><small>${ROLE_NAME[x.role]} · прав: ${x.perms.length}${x.uid ? '' : ' · ждёт первого входа'}</small></span><button class="btn g x" data-e="${x.id}">Изменить</button></div>`).join('') : '<p class="sub">Пока никого.</p>') +
    '<button class="btn" id="sa">Добавить сотрудника</button><button class="btn g" id="bk">Назад</button>', keep);
  bind(sh, '#sa', () => openStaffEdit(r, null));
  sh.querySelectorAll('[data-e]').forEach(b => b.onclick = () => openStaffEdit(r, r.staff.find(x => x.id === +b.dataset.e)));
  bind(sh, '#bk', openPanel);
}

function openStaffEdit(D, row) {
  let role = row ? row.role : 'mod';
  const perms = new Set(row ? row.perms : D.presets.mod);
  const sh = asheet(`<h2>${row ? 'Права сотрудника' : 'Новый сотрудник'}</h2>` +
    (row ? `<p class="sub">${row.handle ? '@' + esc(row.handle) : 'id ' + esc(row.uid)}</p>` : hf('Telegram @username или числовой id', 'sh', '@username')) +
    `<div class="stabs" id="rl"></div><div class="m l">Права</div><div id="pl"></div><div class="er" id="er"></div>
    <button class="btn" id="sv">Сохранить</button>${row ? '<button class="btn g" id="rm">Убрать из персонала</button>' : ''}<button class="btn g" id="bk">Назад</button>`);
  const draw = () => {
    sh.querySelector('#rl').innerHTML = ['admin', 'mod'].map(k => `<button class="stab${k === role ? ' on' : ''}" data-r="${k}">${ROLE_NAME[k]}</button>`).join('');
    sh.querySelector('#pl').innerHTML = PERMS.map(([k, n]) => `<button class="pm${perms.has(k) ? ' on' : ''}" data-p="${k}"><span>${n}</span><i></i></button>`).join('');
  };
  draw();
  sh.querySelector('#rl').onclick = e => { // смена роли подставляет права по умолчанию, дальше их можно менять
    const b = e.target.closest('[data-r]');
    if (!b || b.dataset.r === role) return;
    role = b.dataset.r; perms.clear(); D.presets[role].forEach(p => perms.add(p)); draw();
  };
  sh.querySelector('#pl').onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    perms.has(b.dataset.p) ? perms.delete(b.dataset.p) : perms.add(b.dataset.p); draw();
  };
  bind(sh, '#bk', openStaff);
  bind(sh, '#sv', async () => {
    const r = await api('admin/staff/save', 'POST', { role, perms: [...perms], ...(row ? { id: row.id } : { handle: sh.querySelector('#sh').value }) });
    if (!r.ok) return void (sh.querySelector('#er').textContent = em(r));
    toast('Сохранено'); openStaff();
  });
  bind(sh, '#rm', () => ask('Убрать из персонала? Права пропадут сразу.', async () => {
    const r = await api('admin/staff/remove', 'POST', { id: row.id });
    if (r.ok) { toast('Убран из персонала'); openStaff(); } else toast(em(r));
  }));
}

async function openRep() {
  const r = await api('admin/rep');
  if (!r.ok) return void toast(em(r));
  const sh = asheet('<h2>Репутация игроков</h2><p class="sub">Игроки с минусами за последние 60 дней. Оценки анонимны: видны только суммы.</p>' +
    (r.list.length ? r.list.map(x => `<div class="ar"><span><b>${esc(x.name)}</b><small>−${x.minus} / +${x.plus}${x.banned ? ' · в бане' : ''}</small></span><span class="ac"><button class="btn g x" data-a="pview" data-u="${esc(x.uid)}">Профиль</button>` +
      (can('ban') && !x.banned ? `<button class="btn g x" data-bn="${esc(x.uid)}" data-n="${esc(x.name)}">Бан</button>` : '') + '</span></div>').join('') : '<p class="sub">Минусов пока нет.</p>') +
    '<button class="btn g" id="bk">Назад</button>');
  sh.querySelectorAll('[data-bn]').forEach(b => b.onclick = () => ask(`Забанить ${b.dataset.n}?`, async () => {
    const x = await api('admin/ban', 'POST', { uid: b.dataset.bn, username: b.dataset.n });
    if (x.ok) { toast('Игрок забанен'); openRep(); } else toast(em(x));
  }));
  bind(sh, '#bk', openPanel);
}

async function openBans() {
  const r = await api('admin/bans');
  if (!r.ok) return void toast(em(r));
  const sh = asheet('<h2>Баны</h2><p class="sub">Забаненные не могут занимать роли. Забанить можно в «Управлении игрой», кнопка «Бан» рядом с игроком.</p>' +
    (r.bans.length ? r.bans.map(b => `<div class="ar"><span><b>${b.username ? '@' + esc(b.username) : 'id ' + esc(b.uid)}</b><small>${fmtShort(b.at)}</small></span><button class="btn g x" data-u="${esc(b.uid)}">Разбанить</button></div>`).join('') : '<p class="sub">Список пуст.</p>') +
    '<button class="btn g" id="bk">Назад</button>');
  sh.querySelectorAll('[data-u]').forEach(b => b.onclick = async () => {
    const x = await api('admin/unban', 'POST', { uid: b.dataset.u });
    if (x.ok) { toast('Разбанен'); openBans(); } else toast(em(x));
  });
  bind(sh, '#bk', openPanel);
}

async function openLog() {
  const r = await api('admin/log');
  if (!r.ok) return void toast(em(r));
  const sh = asheet('<h2>Журнал действий</h2><p class="sub">Последние 60 действий персонала.</p>' +
    (r.log.length ? r.log.map(e => `<div class="ar"><span><b>${e.actorName ? '@' + esc(e.actorName) : 'id ' + esc(e.actorId)}</b> <small style="display:inline">${esc(ROLE_NAME[e.role] || '')}</small><br>${esc(ACT[e.action] || e.action)}${e.lobbyId ? ` <small style="display:inline">· игра №${e.lobbyId}</small>` : ''}` +
      `${e.detail ? `<small style="word-break:break-word">${esc(e.detail.slice(0, 120))}</small>` : ''}</span><small>${fmtShort(e.at)}</small></div>`).join('') : '<p class="sub">Пока пусто.</p>') +
    '<button class="btn g" id="bk">Назад</button>');
  bind(sh, '#bk', openPanel);
}

function finishSheet() {
  let win = null;
  const sh = sheet(''), draw = () => {
    const sc = sh.scrollTop;
    sh.innerHTML = `<h2>Итоги матча</h2><p class="sub">Победитель и MVP попадут в историю игроков. MVP получает +${S.mvpRp} RP, лобби очистится.</p>
      <span class="m l">Кто победил</span><div class="stabs" style="grid-template-columns:repeat(3,1fr)">${[[1, 'Команда 1'], [2, 'Команда 2'], [0, 'Не указан']].map(([v, n]) => `<button class="stab${(win || 0) === v ? ' on' : ''}" data-w="${v}">${n}</button>`).join('')}</div>
      <span class="m l">Кто MVP</span>${S.players.map(p => `<button class="role free" data-u="${esc(p.uid)}"><i>${p.team}</i><span><b>${esc(p.name)}</b><small>${esc(roleName(p.role))}</small></span><em>MVP</em></button>`).join('')}
      <button class="btn g" data-u="">Без MVP, только сохранить итог</button>`;
    sh.scrollTop = sc;
  };
  draw();
  sh.onclick = async e => {
    const w = e.target.closest('[data-w]'); if (w) { win = +w.dataset.w || null; return draw(); }
    const b = e.target.closest('[data-u]'); if (!b) return;
    const r = await api('admin/finish', 'POST', { mvpUid: b.dataset.u || null, winner: win });
    if (r.ok) { S = r; sh.parentNode.remove(); render(); toast('Матч сохранён'); loadProfile().then(render); if (r.matchId) matchSheet(r.matchId, true); } else toast(r.error || 'Ошибка');
  };
}

// Оценка игроков после матча: +1 / −1, повторное нажатие снимает оценку
function repSheet() {
  const m = RP; if (!m) return;
  const sh = sheet(''), draw = () => {
    sh.innerHTML = `<h2>Оцени игроков</h2><p class="sub">Плюс за адекватность и командную игру, минус за токсичность, АФК или слив. Оценки анонимны: игроки видят только общий процент.</p>` +
      m.players.map(p => `<div class="ar"><span><b>${esc(p.name)}</b><small>Команда ${p.team}, ${esc(roleName(p.role))}</small></span><span class="ac"><button class="btn x${p.val === 1 ? '' : ' g'}" data-v="1" data-u="${esc(p.uid)}">+1</button><button class="btn x${p.val === -1 ? '' : ' g'}" data-v="-1" data-u="${esc(p.uid)}">−1</button></span></div>`).join('') +
      '<button class="btn" data-a="close">Готово</button>';
  };
  draw();
  sh.onclick = async e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const p = m.players.find(x => x.uid === b.dataset.u), v = +b.dataset.v, val = p.val === v ? 0 : v;
    const r = await api('rep', 'POST', { matchId: m.id, uid: p.uid, val });
    if (r.ok) { p.val = val || null; draw(); render(); } else toast(r.error || 'Ошибка');
  };
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'link') { e.preventDefault(); try { tg.openLink(el.dataset.u); } catch { open(el.dataset.u, '_blank'); } return; }
  tap();
  if (a === 'tab') go(el.dataset.v);
  else if (a.startsWith('go-')) go(a.slice(3));
  else if (a === 'mf') {
    const k = el.dataset.k, v = el.dataset.v;
    if (String(mf[k]) === v) return;
    mf[k] = k === 'days' ? +v : v;
    render();
    if (k === 'rank' || k === 'days') { await loadMeta(); lastM = MC[metaKey()] || lastM; if (tab === 'meta') render(); }
  }
  else if (a === 'bo') { const h = el.dataset.v; openB.has(h) ? openB.delete(h) : openB.add(h); render(); }
  else if (a === 'profile') profileSheet();
  else if (a === 'verify') startVerify(P.mlbbId, P.mlbbZone, el);
  else if (a === 'find') findSheet();
  else if (a === 'draft') { draftOpen = !draftOpen; render(); }
  else if (a === 'rep') repSheet();
  else if (a === 'match') { closeAll(); matchSheet(+el.dataset.m); }
  else if (a === 'share' && LASTM) shareMatch(LASTM);
  else if (a === 'card') cardSheet();
  else if (a === 'close') closeAll();
  else if (a === 'pview') { closeAll(); playerSheet(el.dataset.u); }
  else if (a === 'retry-meta') { delete MC[metaKey()]; render(); await loadMeta(); lastM = MC[metaKey()] || lastM; if (tab === 'meta') render(); }
  else if (a === 'swap') ask('Поменять этих игроков командами? Роли останутся прежними.', async () => {
    const r = await api('admin/swap', 'POST', { role: el.dataset.r });
    if (r.ok) { S = r; render(); toast('Игроки обменялись командами'); } else toast(em(r));
  });
  else if (a === 'claim') {
    if (!P?.mlbbId) { toast('Сначала укажи игровой ID и Zone ID'); return profileSheet(); }
    if (S.me) return toast('Сначала освободи свою текущую роль');
    const team = +el.dataset.t, role = el.dataset.r, prev = S, mine = { uid: myUid(), name: P.nick || 'Ты', username: '', team, role, confirmed: false, power: P.power };
    pend++; S = { ...S, count: S.count + 1, players: [...S.players, mine], me: mine }; render(); // роль занимается сразу, сервер подтвердит следом
    const r = await api('claim', 'POST', { team, role }); pend--;
    if (r.ok) { S = r; toast('Роль занята'); } else { S = prev; toast(r.error || 'Ошибка'); }
    render();
  } else if (a === 'rel') {
    const prev = S; pend++;
    S = { ...S, count: Math.max(0, S.count - 1), players: S.players.filter(p => p.uid !== myUid()), me: null }; render();
    const r = await api('release', 'POST'); pend--;
    if (r.ok) { S = r; toast('Роль освобождена'); } else { S = prev; toast(r.error || 'Ошибка'); }
    render();
  }
  else if (a === 'finish') finishSheet();
  else if (a === 'gadm') openAdmin();
  else if (a === 'pnl') openPanel();
});

let ready = false;
const _render = render;
render = function () { // до первой загрузки показываем заглушку, чтобы карточки не прыгали
  if (ready) return _render();
  setHTML($('#vh'), ''); setHTML($('#vb'), skel(4));
};

(async () => {
  render();
  await Promise.all([loadProfile(), loadLobby()]); ready = true; render();
  loadRep().then(() => { render(); maybeResult(); }); loadRating().then(render); // остальные разделы прогреваются заранее, чтобы открываться мгновенно
  loadMeta().then(() => { lastM = MC[metaKey()] || lastM; if (tab === 'meta') render(); });
  const poll = async () => { // лобби обновляется само, только когда оно на виду
    if (document.hidden || pend || $('.ov') || !['custom', 'home'].includes(tab)) return;
    const had = !!S.me; await loadLobby();
    if (had && !S.me) { await loadRep(); maybeResult(); } // матч закончился: показываем итоги
    if (!pend && !$('.ov')) render();
  };
  setInterval(poll, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
})();
</script>
